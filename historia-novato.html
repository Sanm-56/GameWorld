<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relato Novato - El Despertar</title>
<link rel="stylesheet" href="juegos/css/historia.css">
</head>
<body class="reader-body" data-book-id="novato">
  <main class="reader-shell">
    <nav class="story-nav reader-nav" aria-label="Navegacion">
      <a href="historia.html">Biblioteca</a>
      <a href="index.html">Inicio</a>
    </nav>

    <section class="reader-hero" aria-labelledby="readerTitle">
      <div>
        <span class="story-eyebrow">Relato Novato</span>
        <h1 id="readerTitle">El Despertar</h1>
        <p id="readerSummary">Kael despierta dentro del Nexus como una senal que el Archivo no logra reconocer. Antes de tener un lugar en el torneo, debe estabilizar sus primeros cinco sellos y demostrar que no es un error perdido en el sistema.</p>
      </div>
    </section>

    <section class="reader-layout" aria-label="Relato abierto Novato">
      <aside class="chapter-index" aria-label="Capitulos del relato">
        <span class="detail-kicker">Indice</span>
        <h2>Capitulos</h2>
        <div class="chapter-list" id="chapterList"></div>
      </aside>

      <section class="open-book-stage" aria-live="polite">
        <div class="open-book">
          <span class="book-binding" aria-hidden="true"></span>
          <article class="book-page page-left" id="pageLeft"></article>
          <article class="book-page page-right" id="pageRight"></article>
        </div>

        <div class="reader-controls">
          <button type="button" id="prevPage">Anterior</button>
          <span id="pageIndicator">1 / 1</span>
          <button type="button" id="nextPage">Siguiente</button>
        </div>
        <div class="reader-story-controls" aria-label="Navegacion entre relatos">
          <button type="button" id="prevStory">Anterior Relato</button>
          <button type="button" id="exitStory">Salir Relato</button>
          <button type="button" id="nextStory">Siguiente Relato</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="juegos/js/historia-libro.js"></script>
</body>
</html>
