<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matemáticas</title>

<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>

<body>

<div class="contenedor">

<h1>🧠 Matemáticas PRO</h1>

<div id="reloj">10:00</div>

<div id="nivel"></div>

<div class="marcador-mate" aria-label="Marcador de la partida">
  <div>Correctas: <strong id="correctas">0</strong></div>
  <div>Errores: <strong id="errores">0</strong></div>
</div>

<div class="card">

<p id="pregunta"></p>

<input id="respuesta" inputmode="decimal" autocomplete="off" placeholder="Escribe tu respuesta">

<button class="btn responder" onclick="responder()">Responder</button>

<p id="resultado"></p>

</div>

</div>

<button class="btn musica musica-pos" onclick="manejarClickMusicaMatematicas(event)" ondblclick="abrirMenuMusicaMatematicas(event)">🎵 Música</button>

<audio id="matematicasMusicAudio">
  <source src="./music/musicamatematicas.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="./js/matematicas.js"></script>

<script src="./js/matematicas-music.js"></script>

</body>
</html>
