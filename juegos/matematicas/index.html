<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso Matematicas</title>
<style>
:root{--text:#ecfdf5;--muted:#bbf7d0;--accent:#22c55e;--accent2:#14b8a6;--line:rgba(45,212,191,.28)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 12%,rgba(45,212,191,.21),transparent 30%),radial-gradient(circle at 86% 82%,rgba(34,197,94,.2),transparent 28%),linear-gradient(145deg,#041312,#0d3329 58%,#071b19)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(34,197,94,.075) 25%,transparent 25%),linear-gradient(90deg,rgba(45,212,191,.05) 1px,transparent 1px);background-size:30px 30px,70px 70px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(2,20,18,.72);box-shadow:0 28px 80px rgba(0,0,0,.42)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 10%,rgba(20,184,166,.24),transparent 34%),linear-gradient(180deg,rgba(34,197,94,.13),rgba(3,20,18,.72))}
.formula-orbit{position:absolute;left:50%;top:50%;width:min(78%,440px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(187,247,208,.2);border-radius:50%;box-shadow:0 0 0 42px rgba(20,184,166,.045),0 0 70px rgba(34,197,94,.18)}
.formula-orbit::before,.formula-orbit::after{content:"";position:absolute;inset:15%;border:1px solid rgba(187,247,208,.16);border-radius:50%;transform:rotate(32deg)}.formula-orbit::after{inset:28%;transform:rotate(-26deg)}
.token{position:absolute;display:grid;place-items:center;min-width:74px;min-height:54px;padding:10px 12px;border:1px solid rgba(187,247,208,.28);border-radius:18px;background:linear-gradient(145deg,rgba(34,197,94,.26),rgba(20,184,166,.18)),rgba(2,6,23,.45);box-shadow:0 18px 34px rgba(0,0,0,.28);font-weight:1000;font-size:clamp(18px,3vw,28px);animation:mathFloat 3.6s ease-in-out infinite}
.t1{left:6%;top:22%}.t2{right:7%;top:18%;animation-delay:.4s}.t3{left:31%;top:43%;animation-delay:.9s}.t4{right:11%;bottom:22%;animation-delay:1.2s}.t5{left:12%;bottom:17%;animation-delay:1.6s}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 32%),rgba(2,20,18,.8)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(45,212,191,.42);border-radius:999px;padding:8px 12px;color:#5eead4;background:rgba(2,6,23,.38);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(45,212,191,.34);outline:none;color:var(--text);background:rgba(2,6,23,.56);font:inherit}input::placeholder{color:#99f6e4}input:focus{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.16)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:#02120f;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(20,184,166,.24)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes mathFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-14px,0)}}
@media (prefers-reduced-motion:reduce){.token{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.formula-orbit{width:86%}.token{min-width:58px;min-height:42px;border-radius:14px;font-size:17px}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell">
  <section class="visual" aria-hidden="true">
    <div class="formula-orbit">
      <span class="token t1">7x</span>
      <span class="token t2">+12</span>
      <span class="token t3">=</span>
      <span class="token t4">42</span>
      <span class="token t5">x2</span>
    </div>
  </section>
  <section class="panel">
    <span class="kicker">Calculo rapido</span>
    <h1>Matematicas</h1>
    <p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p>
    <div class="fields">
      <label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label>
      <label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label>
    </div>
    <div class="actions">
      <button class="primary" onclick="entrar()">Entrar</button>
      <button class="back" onclick="window.location.href='../../index.html'">Volver</button>
    </div>
  </section>
</main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
