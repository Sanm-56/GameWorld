<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Arcade - Final</title>
  <link rel="stylesheet" href="../css/arcade.css">
</head>
<body class="final-page" data-game="cricketarcade">
  <main class="final-card">
    <h1 id="finalTitle"></h1>
    <p id="finalSubtitle"></p>
    <h2 id="resultText"></h2>
    <p id="deltaText"></p>
    <section class="summary-grid">
      <div class="summary-item"><span>Puntuacion final</span><strong id="scoreValue">0</strong></div>
      <div class="summary-item"><span>Tiempo realizado</span><strong id="timeValue">-</strong></div>
      <div class="summary-item"><span>Record de combo</span><strong id="comboValue">0</strong></div>
    </section>
    <section class="final-layout"><div class="podium" id="podio"></div><div class="ranking" id="ranking"></div></section>
    <button class="back" id="backBtn">Volver</button>
  </main>
  <script type="module" src="../js/arcade-final.js"></script>
</body>
</html>
