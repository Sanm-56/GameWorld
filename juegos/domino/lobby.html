<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Domino</title>

<link rel="stylesheet" href="../css/responsive-desktop.css">
<style>
:root{
--bg:#07110f;
--panel:#0c1816;
--text:#f8fafc;
--muted:#c8d5d1;
--bone:#f8fafc;
--ink:#0f172a;
--teal:#2dd4bf;
--gold:#fbbf24;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 18% 18%, rgba(45,212,191,0.18), transparent 30%),
radial-gradient(circle at 82% 24%, rgba(251,191,36,0.15), transparent 27%),
linear-gradient(135deg, #03100d 0%, var(--bg) 50%, #111827 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(circle, rgba(248,250,252,0.055) 1px, transparent 2px),
linear-gradient(90deg, rgba(45,212,191,0.035), transparent 45%, rgba(251,191,36,0.035));
background-size:34px 34px, 100% 100%;
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(120deg, transparent 18%, rgba(255,255,255,0.055) 48%, transparent 66%);
animation:dominoSweep 8.5s ease-in-out infinite;
}

.container{
width:min(100%, 900px);
max-width:900px;
min-width:0;
padding:0;
border:1px solid rgba(45,212,191,0.22);
border-radius:22px;
background:linear-gradient(145deg, rgba(12,24,22,0.96), rgba(7,12,20,0.95));
box-shadow:0 30px 90px rgba(0,0,0,0.44), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 12% 12%, rgba(45,212,191,0.15), transparent 28%),
radial-gradient(circle at 92% 88%, rgba(251,191,36,0.12), transparent 30%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1fr) minmax(285px, 1fr);
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(45,212,191,0.34);
border-radius:999px;
background:rgba(19,78,74,0.34);
color:#ccfbf1;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.5rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#d1fae5;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(45,212,191,0.18);
border-radius:16px;
background:rgba(2,6,23,0.32);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#ccfbf1;
font-weight:800;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #0f766e, #334155);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.domino-stage{
position:relative;
min-height:430px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
radial-gradient(circle at center, rgba(45,212,191,0.13), transparent 58%),
linear-gradient(180deg, rgba(20,83,45,0.12), rgba(2,6,23,0.26));
border-left:1px solid rgba(45,212,191,0.14);
overflow:hidden;
}

.table-ring{
position:absolute;
width:min(370px, 88%);
aspect-ratio:1;
border-radius:50%;
border:1px solid rgba(204,251,241,0.18);
box-shadow:inset 0 0 70px rgba(45,212,191,0.08);
animation:dominoSpin 20s linear infinite;
}

.domino-line{
position:relative;
width:min(350px, 100%);
height:280px;
}

.tile{
position:absolute;
width:76px;
height:148px;
display:grid;
grid-template-rows:1fr 1px 1fr;
gap:0;
padding:10px;
border-radius:16px;
border:1px solid rgba(15,23,42,0.22);
background:linear-gradient(145deg, #fffaf0, var(--bone));
box-shadow:0 18px 36px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.8);
transform-origin:center;
}

.tile::before{
content:"";
grid-row:2;
display:block;
height:1px;
background:rgba(15,23,42,0.32);
}

.half{
display:grid;
grid-template-columns:repeat(3, 1fr);
grid-template-rows:repeat(3, 1fr);
gap:2px;
}

.pip{
width:8px;
height:8px;
border-radius:50%;
background:var(--ink);
align-self:center;
justify-self:center;
box-shadow:0 1px 0 rgba(255,255,255,0.2);
}

.p1{grid-column:2;grid-row:2;}
.p2{grid-column:1;grid-row:1;}
.p3{grid-column:3;grid-row:3;}
.p4{grid-column:3;grid-row:1;}
.p5{grid-column:1;grid-row:3;}
.p6{grid-column:1;grid-row:2;}
.p7{grid-column:3;grid-row:2;}

.t1{left:22px;top:66px;transform:rotate(-24deg);}
.t2{left:102px;top:34px;transform:rotate(68deg);}
.t3{left:174px;top:82px;transform:rotate(-18deg);}
.t4{left:242px;top:34px;transform:rotate(48deg);}
.t5{left:128px;top:156px;transform:rotate(90deg);}

.score-chip{
position:absolute;
display:inline-flex;
align-items:center;
justify-content:center;
min-width:58px;
height:42px;
padding:0 12px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.18);
background:rgba(15,23,42,0.76);
color:#fef3c7;
font-weight:900;
box-shadow:0 16px 32px rgba(0,0,0,0.26);
animation:dominoFloat 5s ease-in-out infinite;
}

.c1{top:42px;right:30px;}
.c2{bottom:54px;left:24px;animation-delay:-1.8s;color:#ccfbf1;}
.c3{bottom:96px;right:42px;animation-delay:-3.1s;color:#e2e8f0;}

@keyframes dominoFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(5deg);}
}

@keyframes dominoSpin{
to{transform:rotate(360deg);}
}

@keyframes dominoSweep{
0%,100%{transform:translateX(-20%);opacity:0.45;}
50%{transform:translateX(18%);opacity:0.78;}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.domino-stage{min-height:330px;border-left:none;border-top:1px solid rgba(45,212,191,0.14);padding:30px 18px 36px;}
.domino-line{width:min(292px, 92vw);height:238px;transform:scale(0.82);}
.score-chip{min-width:50px;height:36px;font-size:14px;}
.c1{top:18px;right:16px;}
.c2{bottom:18px;left:16px;}
.c3{display:none;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>

<body>
<main class="container" aria-label="Lobby de espera Domino">
  <div class="lobby-layout">
    <section class="lobby-copy">
      <span class="lobby-kicker">Lobby de espera</span>
      <h1>Domino</h1>
      <p class="subtitle">Las fichas ya estan sobre la mesa. Calcula la salida y espera el inicio del torneo.</p>
      <div class="status-card">
        <p id="mensaje">Esperando que el torneo inicie...</p>
      </div>
      <div class="actions">
        <button class="musica-btn" onclick="manejarClickMusicaDomino(event)" ondblclick="abrirMenuMusicaDomino(event)">Musica</button>
      </div>
    </section>

    <section class="domino-stage" aria-hidden="true">
      <div class="table-ring"></div>
      <span class="score-chip c1">6|6</span>
      <span class="score-chip c2">+20</span>
      <span class="score-chip c3">PASE</span>
      <div class="domino-line">
        <div class="tile t1"><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span></div><div class="half"><span class="pip p1"></span></div></div>
        <div class="tile t2"><div class="half"><span class="pip p2"></span><span class="pip p3"></span></div><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p1"></span></div></div>
        <div class="tile t3"><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span></div><div class="half"><span class="pip p2"></span><span class="pip p3"></span></div></div>
        <div class="tile t4"><div class="half"><span class="pip p1"></span></div><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span></div></div>
        <div class="tile t5"><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span></div><div class="half"><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span></div></div>
      </div>
    </section>
  </div>
</main>

<audio id="dominoMusicAudio">
  <source src="./music/dominomusic.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="../js/lobby.js"></script>
<script src="./js/domino-music.js"></script>
</body>
</html>
