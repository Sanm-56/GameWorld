<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso Domino</title>
<style>
:root{--text:#fff7ed;--muted:#fed7aa;--accent:#f59e0b;--accent2:#ea580c;--line:rgba(245,158,11,.3)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 12%,rgba(245,158,11,.24),transparent 30%),radial-gradient(circle at 86% 82%,rgba(234,88,12,.2),transparent 28%),linear-gradient(145deg,#1a0f05,#3b1f08)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(42,22,9,.76);box-shadow:0 28px 80px rgba(0,0,0,.44)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 8%,rgba(245,158,11,.25),transparent 34%),linear-gradient(180deg,rgba(92,43,8,.25),rgba(28,13,4,.74))}
.domino-table{position:absolute;inset:0}.tile{position:absolute;width:96px;height:188px;border-radius:18px;border:2px solid rgba(255,247,237,.65);background:linear-gradient(145deg,#fff7ed,#fed7aa);box-shadow:0 24px 42px rgba(0,0,0,.36);display:grid;grid-template-rows:1fr 2px 1fr;padding:16px;animation:dominoDrift 3.4s ease-in-out infinite}.tile::before{content:"";background:#7c2d12;border-radius:999px}.tile::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;background:#7c2d12}.tile.a{left:18%;top:23%;transform:rotate(-18deg)}.tile.b{left:46%;top:16%;transform:rotate(12deg);animation-delay:.7s}.tile.c{right:17%;bottom:18%;transform:rotate(-8deg);animation-delay:1.2s}.pips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pip{width:9px;height:9px;border-radius:50%;background:#7c2d12;align-self:center;justify-self:center}.blank{opacity:0}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.075),transparent 32%),rgba(28,13,4,.78)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(245,158,11,.44);border-radius:999px;padding:8px 12px;color:#fdba74;background:rgba(2,6,23,.35);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(245,158,11,.34);outline:none;color:var(--text);background:rgba(2,6,23,.56);font:inherit}input::placeholder{color:#fdba74}input:focus{border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(234,88,12,.26)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes dominoDrift{0%,100%{translate:0 0}50%{translate:0 -13px}}@media (prefers-reduced-motion:reduce){.tile{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.tile{width:72px;height:140px;border-radius:14px;padding:11px}.pip{width:7px;height:7px}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell"><section class="visual" aria-hidden="true"><div class="domino-table">
<span class="tile a"><span class="pips"><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i></span><b></b><span class="pips"><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i></span></span>
<span class="tile b"><span class="pips"><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i></span><b></b><span class="pips"><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i></span></span>
<span class="tile c"><span class="pips"><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="blank"></i><i class="blank"></i><i class="pip"></i></span><b></b><span class="pips"><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i><i class="blank"></i><i class="pip"></i></span></span>
</div></section><section class="panel"><span class="kicker">Mesa de torneo</span><h1>Domino</h1><p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p><div class="fields"><label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label><label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label></div><div class="actions"><button class="primary" onclick="entrar()">Entrar</button><button class="back" onclick="window.location.href='../../index.html'">Volver</button></div></section></main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
