<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflejos VIP - GameWorld</title>
<style>
:root{
  color-scheme:dark;
  --gold:#f8d774;
  --gold-strong:#f59e0b;
  --text:#f8fafc;
  --muted:#cbd5e1;
}

*{box-sizing:border-box}

body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:18px;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 18% 10%,rgba(250,204,21,.12),transparent 32%),
    radial-gradient(circle at 84% 20%,rgba(56,189,248,.1),transparent 30%),
    linear-gradient(145deg,#020617,#111827 58%,#0f172a);
}

.game-shell{
  width:min(980px,100%);
  min-height:min(680px,calc(100vh - 36px));
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  border:1px solid rgba(250,204,21,.24);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(2,6,23,.86));
  box-shadow:0 28px 88px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.06);
}

.game-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:18px 20px;
  border-bottom:1px solid rgba(250,204,21,.14);
}

.game-title span{
  display:block;
  color:var(--gold);
  font-size:12px;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
}

h1{
  margin:4px 0 0;
  font-size:clamp(26px,5vw,46px);
  line-height:1;
  letter-spacing:0;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

select,
button{
  min-height:42px;
  border:1px solid rgba(250,204,21,.28);
  border-radius:12px;
  padding:10px 14px;
  color:#fff7ed;
  background:rgba(15,23,42,.72);
  cursor:pointer;
  font:inherit;
  font-weight:900;
}

select{
  min-width:146px;
  color:#f8fafc;
  background:rgba(15,23,42,.72);
}

button.primary{
  color:#111827;
  background:linear-gradient(135deg,#fde68a,#f59e0b);
}

button:disabled{
  cursor:not-allowed;
  opacity:.58;
}

.game-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 270px;
  gap:18px;
  padding:20px;
}

.arena{
  position:relative;
  min-height:420px;
  overflow:hidden;
  border:1px solid rgba(250,204,21,.18);
  border-radius:8px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(0deg,rgba(255,255,255,.04) 1px,transparent 1px),
    rgba(2,6,23,.5);
  background-size:34px 34px;
}

.target{
  position:absolute;
  width:var(--target-size,62px);
  height:var(--target-size,62px);
  display:grid;
  place-items:center;
  border:2px solid rgba(255,255,255,.76);
  border-radius:50%;
  color:#111827;
  background:radial-gradient(circle,#fef3c7,#f59e0b);
  box-shadow:0 0 26px rgba(250,204,21,.34);
  transform:translate(-50%,-50%);
  transition:transform .12s ease, filter .12s ease;
}

.target:hover{
  transform:translate(-50%,-50%) scale(1.06);
  filter:brightness(1.08);
}

.panel{
  display:grid;
  align-content:start;
  gap:12px;
  min-width:0;
}

.stat{
  border:1px solid rgba(148,163,184,.14);
  border-radius:8px;
  padding:13px;
  background:rgba(15,23,42,.66);
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  display:block;
  margin-top:5px;
  color:#fef3c7;
  font-size:24px;
}

.stat.compact strong{
  font-size:20px;
}

.history{
  border:1px solid rgba(148,163,184,.14);
  border-radius:8px;
  padding:13px;
  background:rgba(15,23,42,.66);
}

.history strong{
  display:block;
  margin-bottom:8px;
  color:#fef3c7;
}

.history-list{
  display:grid;
  gap:6px;
  color:var(--muted);
  font-size:13px;
}

.status{
  min-height:46px;
  margin:0 20px 20px;
  display:flex;
  align-items:center;
  border:1px solid rgba(250,204,21,.18);
  border-radius:8px;
  padding:12px 14px;
  color:#fde68a;
  background:rgba(15,23,42,.7);
}

[hidden]{display:none!important}

@media (max-width:760px){
  body{align-items:start;padding:10px}
  .game-shell{min-height:calc(100vh - 20px);border-radius:16px}
  .game-head{align-items:flex-start;flex-direction:column}
  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .actions select{width:100%;min-width:0}
  .game-main{grid-template-columns:1fr;padding:14px}
  .arena{min-height:360px}
  .status{margin:0 14px 14px}
}

@media (max-width:460px){
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="game-shell">
  <header class="game-head">
    <div class="game-title">
      <span>Juego exclusivo VIP</span>
      <h1>Reflejos VIP</h1>
    </div>
    <div class="actions">
      <select id="modeSelect" aria-label="Modo de juego">
        <option value="classic">Clasico 30s</option>
        <option value="rush">Rush 20s</option>
        <option value="endurance">Resistencia 45s</option>
      </select>
      <button type="button" onclick="window.location.href='../../../vip.html'">Zona VIP</button>
      <button class="primary" type="button" id="startBtn">Iniciar</button>
      <button type="button" id="pauseBtn" disabled>Pausar</button>
    </div>
  </header>

  <section class="game-main" id="gameContent" hidden>
    <div class="arena" id="arena" aria-label="Arena de reflejos"></div>
    <aside class="panel">
      <div class="stat">
        <span>Puntos</span>
        <strong id="scoreEl">0</strong>
      </div>
      <div class="stat">
        <span>Tiempo</span>
        <strong id="timeEl">30</strong>
      </div>
      <div class="stat">
        <span>Mejor local</span>
        <strong id="bestEl">0</strong>
      </div>
      <div class="stat compact">
        <span>Combo</span>
        <strong id="comboEl">x0</strong>
      </div>
      <div class="stat compact">
        <span>Precision</span>
        <strong id="accuracyEl">100%</strong>
      </div>
      <div class="history">
        <strong>Ultimas partidas</strong>
        <div class="history-list" id="historyEl">Sin partidas todavia.</div>
      </div>
    </aside>
  </section>

  <div class="status" id="statusEl">Validando acceso VIP...</div>
</main>

<script type="module">
import { validateVipSession } from "../../js/vip.js"
import { calculateVipRewards, getVipGameHistory, registerVipGameResult } from "../../js/vip-results.js"
import { submitVipPrivateTournamentResult, validateVipPrivateTournamentLaunch } from "../../js/vip-private-tournaments.js"

const content = document.getElementById("gameContent")
const statusEl = document.getElementById("statusEl")
const arena = document.getElementById("arena")
const startBtn = document.getElementById("startBtn")
const pauseBtn = document.getElementById("pauseBtn")
const modeSelect = document.getElementById("modeSelect")
const scoreEl = document.getElementById("scoreEl")
const timeEl = document.getElementById("timeEl")
const bestEl = document.getElementById("bestEl")
const comboEl = document.getElementById("comboEl")
const accuracyEl = document.getElementById("accuracyEl")
const historyEl = document.getElementById("historyEl")

const MODES = {
  classic: { label: "Clasico", seconds: 30, targetMs: 1250, size: 62, points: 10 },
  rush: { label: "Rush", seconds: 20, targetMs: 880, size: 54, points: 14 },
  endurance: { label: "Resistencia", seconds: 45, targetMs: 1400, size: 66, points: 8 },
}

let score = 0
let timeLeft = 30
let timer = null
let targetTimer = null
let running = false
let paused = false
let hits = 0
let misses = 0
let combo = 0
let bestCombo = 0
let privateTournamentState = null

function currentMode() {
  return MODES[modeSelect?.value] || MODES.classic
}

function bestScore() {
  return Math.max(0, Number(localStorage.getItem(`vip_reflejos_best_${modeSelect?.value || "classic"}`) || 0))
}

function setStatus(text) {
  if (statusEl) statusEl.textContent = text
}

function updateHud() {
  scoreEl.textContent = String(score)
  timeEl.textContent = String(timeLeft)
  bestEl.textContent = String(bestScore())
  comboEl.textContent = `x${combo}`
  const total = hits + misses
  const accuracy = total ? Math.round((hits / total) * 100) : 100
  accuracyEl.textContent = `${accuracy}%`
}

async function renderHistory() {
  if (!historyEl) return
  if (privateTournamentState) {
    historyEl.textContent = "Resultado privado pendiente para esta sala."
    return
  }
  const history = await getVipGameHistory({ gameKey: "reflejos-vip", limit: 5 })
  if (!history.length) {
    historyEl.textContent = "Sin partidas todavia."
    return
  }
  historyEl.innerHTML = ""
  history.forEach((item) => {
    const metrics = item.metrics || {}
    const total = Number(metrics.total ?? metrics.hits + metrics.misses) || 0
    const precision = Number(metrics.accuracy) || (total ? Math.round((Number(metrics.hits || 0) / total) * 100) : 100)
    const comboMax = Number(metrics.bestCombo ?? metrics.combo ?? 0)
    const row = document.createElement("span")
    row.textContent = `${item.mode || "VIP"}: ${item.score} pts | ${precision}% | combo x${comboMax}`
    historyEl.appendChild(row)
  })
}

function placeTarget() {
  if (!arena || !running) return
  clearTimeout(targetTimer)
  arena.innerHTML = ""
  const rect = arena.getBoundingClientRect()
  const mode = currentMode()
  const target = document.createElement("button")
  target.type = "button"
  target.className = "target"
  target.setAttribute("aria-label", "Objetivo")
  target.textContent = "+"
  target.style.setProperty("--target-size", `${mode.size}px`)
  target.style.left = `${mode.size / 2 + Math.random() * Math.max(1, rect.width - mode.size)}px`
  target.style.top = `${mode.size / 2 + Math.random() * Math.max(1, rect.height - mode.size)}px`
  target.addEventListener("click", (event) => {
    event.stopPropagation()
    hits += 1
    combo += 1
    bestCombo = Math.max(bestCombo, combo)
    score += mode.points + Math.min(30, combo * 2)
    updateHud()
    placeTarget()
  })
  arena.appendChild(target)
  targetTimer = setTimeout(() => {
    if (!running || paused) return
    misses += 1
    combo = 0
    updateHud()
    placeTarget()
  }, mode.targetMs)
}

async function finishGame() {
  running = false
  paused = false
  clearInterval(timer)
  clearTimeout(targetTimer)
  timer = null
  targetTimer = null
  arena.innerHTML = ""
  startBtn.disabled = false
  pauseBtn.disabled = true
  pauseBtn.textContent = "Pausar"
  modeSelect.disabled = false
  const modeKey = modeSelect?.value || "classic"
  const best = bestScore()
  if (score > best) localStorage.setItem(`vip_reflejos_best_${modeKey}`, String(score))
  const total = hits + misses
  const accuracy = total ? Math.round((hits / total) * 100) : 100
  const rewards = calculateVipRewards({ score, hits, accuracy, bestCombo })
  const metrics = {
    hits,
    misses,
    total,
    accuracy,
    bestCombo,
    modeKey,
    mode: currentMode().label,
  }
  const saved = privateTournamentState
    ? await submitVipPrivateTournamentResult({
      gameKey: "reflejos-vip",
      tournamentId: privateTournamentState.tournament?.id,
      score,
      timeSeconds: currentMode().seconds,
      metrics,
    })
    : await registerVipGameResult({
      gameKey: "reflejos-vip",
      gameTitle: "Reflejos VIP",
      mode: currentMode().label,
      score,
      metrics,
      rewards,
    })
  updateHud()
  await renderHistory()
  if (privateTournamentState) {
    setStatus(saved.ok ? "Resultado privado VIP guardado. No entra a ranking normal ni historial VIP general." : saved.message || "No se pudo guardar resultado privado VIP.")
    return
  }
  const remoteText = saved.remote ? "Resultado VIP guardado." : "Resultado guardado localmente."
  setStatus(`${remoteText} +${rewards.vipCoins} monedas VIP, +${rewards.vipXp} XP VIP, +${rewards.vipTickets} tickets. No entra a rankings normales.`)
}

function startGame() {
  if (running) return
  const mode = currentMode()
  score = 0
  hits = 0
  misses = 0
  combo = 0
  bestCombo = 0
  timeLeft = mode.seconds
  running = true
  paused = false
  startBtn.disabled = true
  pauseBtn.disabled = false
  pauseBtn.textContent = "Pausar"
  modeSelect.disabled = true
  updateHud()
  setStatus(`Modo ${mode.label}. Toca los objetivos dorados y conserva el combo.`)
  placeTarget()
  timer = setInterval(() => {
    if (paused) return
    timeLeft -= 1
    updateHud()
    if (timeLeft <= 0) finishGame()
  }, 1000)
}

function togglePause() {
  if (!running) return
  paused = !paused
  pauseBtn.textContent = paused ? "Continuar" : "Pausar"
  if (paused) {
    clearTimeout(targetTimer)
    arena.innerHTML = ""
    setStatus("Partida pausada.")
  } else {
    setStatus("Partida reanudada.")
    placeTarget()
  }
}

const ok = await validateVipSession({ statusElement: statusEl, contentElement: content })
if (ok) {
  const privateAccess = await validateVipPrivateTournamentLaunch("reflejos-vip")
  if (privateAccess.privateTournament && !privateAccess.ok) {
    setStatus(privateAccess.message || "No se pudo validar el minitorneo VIP privado.")
    startBtn.disabled = true
    pauseBtn.disabled = true
  } else {
    privateTournamentState = privateAccess.ok ? privateAccess.state : null
    setStatus(privateTournamentState ? "Minitorneo VIP privado validado. Listo para jugar." : "Acceso VIP activo. Listo para jugar.")
  }
  updateHud()
  await renderHistory()
} else {
  startBtn.disabled = true
  pauseBtn.disabled = true
}

startBtn.addEventListener("click", startGame)
pauseBtn.addEventListener("click", togglePause)
modeSelect.addEventListener("change", updateHud)
arena.addEventListener("click", () => {
  if (!running || paused) return
  misses += 1
  combo = 0
  updateHud()
})
</script>
</body>
</html>
