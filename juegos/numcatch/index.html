<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso NumCatch</title>
<style>
:root{--text:#f8fafc;--muted:#bbf7d0;--accent:#22c55e;--accent2:#3b82f6;--line:rgba(34,197,94,.28)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 12%,rgba(34,197,94,.2),transparent 30%),radial-gradient(circle at 86% 82%,rgba(59,130,246,.16),transparent 28%),linear-gradient(145deg,#071a12,#0b2a1a)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(34,197,94,.055) 1px,transparent 1px),linear-gradient(0deg,rgba(59,130,246,.04) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(4,24,16,.76);box-shadow:0 28px 80px rgba(0,0,0,.44)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 8%,rgba(34,197,94,.24),transparent 34%),linear-gradient(180deg,rgba(59,130,246,.12),rgba(4,24,16,.78))}
.catch-field{position:absolute;left:50%;top:50%;width:min(78%,430px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:32px;border:1px solid rgba(187,247,208,.22);background:rgba(2,6,23,.24);box-shadow:0 24px 60px rgba(0,0,0,.34),inset 0 0 44px rgba(34,197,94,.08)}
.num{position:absolute;display:grid;place-items:center;width:70px;height:70px;border:1px solid rgba(187,247,208,.34);border-radius:22px;background:linear-gradient(145deg,rgba(34,197,94,.34),rgba(59,130,246,.18)),rgba(2,6,23,.55);box-shadow:0 18px 34px rgba(0,0,0,.28);font-size:28px;font-weight:1000;animation:numDrop 3.2s ease-in-out infinite}.n1{left:12%;top:15%}.n2{right:13%;top:24%;animation-delay:.45s}.n3{left:25%;bottom:18%;animation-delay:.9s}.n4{right:20%;bottom:16%;animation-delay:1.35s}.catcher{position:absolute;left:50%;bottom:10%;width:96px;height:28px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(135deg,#22c55e,#3b82f6);box-shadow:0 18px 34px rgba(0,0,0,.3),0 0 26px rgba(34,197,94,.3);animation:catcherSlide 3.8s ease-in-out infinite}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.075),transparent 32%),rgba(4,24,16,.82)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(34,197,94,.44);border-radius:999px;padding:8px 12px;color:#86efac;background:rgba(2,6,23,.42);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(34,197,94,.34);outline:none;color:var(--text);background:rgba(2,6,23,.56);font:inherit}input::placeholder{color:#86efac}input:focus{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.16)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(34,197,94,.24)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes numDrop{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}@keyframes catcherSlide{0%,100%{transform:translateX(-70%)}50%{transform:translateX(-30%)}}@media (prefers-reduced-motion:reduce){.num,.catcher{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.catch-field{width:86%}.num{width:54px;height:54px;border-radius:16px;font-size:22px}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell"><section class="visual" aria-hidden="true"><div class="catch-field"><span class="num n1">3</span><span class="num n2">12</span><span class="num n3">8</span><span class="num n4">21</span><span class="catcher"></span></div></section><section class="panel"><span class="kicker">Numeros en movimiento</span><h1>NumCatch</h1><p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p><div class="fields"><label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label><label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label></div><div class="actions"><button class="primary" onclick="entrar()">Entrar</button><button class="back" onclick="window.location.href='../../index.html'">Volver</button></div></section></main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
