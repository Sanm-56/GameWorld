<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby NumCatch</title>

  <link rel="stylesheet" href="../css/responsive-desktop.css">
  <style>
:root{
--bg:#07140f;
--panel:#0b1f18;
--text:#f7fee7;
--muted:#c7d7cb;
--green:#22c55e;
--lime:#bef264;
--blue:#38bdf8;
--orange:#fb923c;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 18% 18%, rgba(34,197,94,0.2), transparent 30%),
radial-gradient(circle at 82% 24%, rgba(56,189,248,0.16), transparent 28%),
linear-gradient(135deg, #03100b 0%, var(--bg) 52%, #101827 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(90deg, rgba(190,242,100,0.05) 1px, transparent 1px),
linear-gradient(rgba(56,189,248,0.035) 1px, transparent 1px);
background-size:56px 56px;
mask-image:linear-gradient(to bottom, rgba(0,0,0,0.93), rgba(0,0,0,0.2));
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(120deg, transparent 18%, rgba(255,255,255,0.055) 48%, transparent 66%);
animation:numSweep 7.5s ease-in-out infinite;
}

.container{
width:min(100%, 910px);
max-width:910px;
min-width:0;
padding:0;
border:1px solid rgba(34,197,94,0.22);
border-radius:22px;
background:linear-gradient(145deg, rgba(11,31,24,0.96), rgba(5,12,18,0.95));
box-shadow:0 30px 90px rgba(0,0,0,0.44), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 12% 12%, rgba(34,197,94,0.16), transparent 28%),
radial-gradient(circle at 92% 86%, rgba(56,189,248,0.12), transparent 30%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1fr) minmax(285px, 1fr);
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(190,242,100,0.36);
border-radius:999px;
background:rgba(22,101,52,0.34);
color:#dcfce7;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.55rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#d9f99d;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(190,242,100,0.18);
border-radius:16px;
background:rgba(2,6,23,0.32);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#bbf7d0;
font-weight:800;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #16a34a, #0284c7);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.catch-stage{
position:relative;
min-height:430px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
radial-gradient(circle at center, rgba(34,197,94,0.14), transparent 58%),
linear-gradient(180deg, rgba(14,116,144,0.12), rgba(2,6,23,0.24));
border-left:1px solid rgba(190,242,100,0.14);
overflow:hidden;
}

.catch-field{
position:relative;
width:min(340px, 100%);
height:340px;
border:1px solid rgba(255,255,255,0.15);
border-radius:22px;
background:
linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px),
rgba(15,23,42,0.54);
background-size:42px 42px;
box-shadow:0 24px 70px rgba(2,6,23,0.44), 0 0 34px rgba(34,197,94,0.14);
overflow:hidden;
transform:rotate(2deg);
}

.fall-num{
position:absolute;
display:grid;
place-items:center;
width:58px;
height:58px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.18);
background:rgba(15,23,42,0.82);
font-size:clamp(1.1rem, 4vw, 1.6rem);
font-weight:900;
box-shadow:0 14px 28px rgba(0,0,0,0.24);
animation:numFall 5.4s ease-in-out infinite;
}

.n1{left:28px;top:26px;color:#bbf7d0;}
.n2{left:142px;top:62px;color:#bae6fd;animation-delay:-1.5s;}
.n3{right:34px;top:24px;color:#fed7aa;animation-delay:-2.8s;}
.n4{left:70px;top:160px;color:#d9f99d;animation-delay:-3.6s;}
.n5{right:72px;top:180px;color:#fef08a;animation-delay:-0.8s;}

.catcher{
position:absolute;
left:50%;
bottom:24px;
width:150px;
height:58px;
border-radius:16px 16px 28px 28px;
transform:translateX(-50%);
background:linear-gradient(135deg, #22c55e, #0284c7);
box-shadow:0 18px 36px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.18);
}

.catcher::before{
content:"";
position:absolute;
left:18px;
right:18px;
top:11px;
height:12px;
border-radius:999px;
background:rgba(236,253,245,0.82);
}

.target-chip{
position:absolute;
display:inline-flex;
align-items:center;
justify-content:center;
min-width:58px;
height:42px;
padding:0 12px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.18);
background:rgba(15,23,42,0.76);
font-weight:900;
box-shadow:0 16px 32px rgba(0,0,0,0.26);
animation:numFloat 5s ease-in-out infinite;
}

.t1{top:42px;right:30px;color:#bbf7d0;}
.t2{bottom:54px;left:24px;color:#bae6fd;animation-delay:-1.8s;}
.t3{bottom:96px;right:42px;color:#fed7aa;animation-delay:-3.1s;}

@keyframes numFall{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(22px) rotate(6deg);}
}

@keyframes numFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(-5deg);}
}

@keyframes numSweep{
0%,100%{transform:translateX(-20%);opacity:0.45;}
50%{transform:translateX(18%);opacity:0.78;}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.catch-stage{min-height:340px;border-left:none;border-top:1px solid rgba(190,242,100,0.14);padding:32px 18px 38px;}
.catch-field{width:min(292px, 92vw);height:292px;transform:rotate(0deg);}
.fall-num{width:48px;height:48px;border-radius:14px;}
.catcher{width:126px;height:50px;}
.target-chip{min-width:50px;height:36px;font-size:14px;}
.t1{top:18px;right:16px;}
.t2{bottom:18px;left:16px;}
.t3{display:none;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
  </style>
</head>
<body>
  <main class="container" aria-label="Lobby de espera NumCatch">
    <div class="lobby-layout">
      <section class="lobby-copy">
        <span class="lobby-kicker">Lobby de espera</span>
        <h1>NumCatch</h1>
        <p class="subtitle">Los numeros ya estan cayendo. Apunta al objetivo, prepara el movimiento y espera el inicio.</p>
        <div class="status-card">
          <p id="mensaje">Esperando que el torneo inicie...</p>
        </div>
        <div class="actions">
          <button class="musica-btn" onclick="manejarClickMusicaNumCatch(event)" ondblclick="abrirMenuMusicaNumCatch(event)">Musica</button>
        </div>
      </section>

      <section class="catch-stage" aria-hidden="true">
        <span class="target-chip t1">OBJ 21</span>
        <span class="target-chip t2">+12</span>
        <span class="target-chip t3">x2</span>
        <div class="catch-field">
          <span class="fall-num n1">3</span>
          <span class="fall-num n2">12</span>
          <span class="fall-num n3">8</span>
          <span class="fall-num n4">21</span>
          <span class="fall-num n5">5</span>
          <span class="catcher"></span>
        </div>
      </section>
    </div>
  </main>

  <audio id="numcatchMusicAudio">
    <source src="./musicc/numcatch.mp3" type="audio/mpeg" />
  </audio>

  <script type="module" src="../js/lobby.js"></script>
  <script src="./js/numcatch-music.js"></script>
</body>
</html>
