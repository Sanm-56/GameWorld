<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Damas</title>

<link rel="stylesheet" href="../css/responsive-desktop.css">
<style>
:root{
--bg:#15090b;
--panel:#1c1113;
--text:#fff7ed;
--muted:#f2d4c9;
--red:#ef4444;
--rose:#fb7185;
--cream:#fff1dc;
--charcoal:#1f2937;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 18% 18%, rgba(239,68,68,0.2), transparent 30%),
radial-gradient(circle at 84% 22%, rgba(255,241,220,0.12), transparent 27%),
linear-gradient(135deg, #080405 0%, var(--bg) 50%, #111827 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(45deg, rgba(255,241,220,0.045) 25%, transparent 25% 75%, rgba(255,241,220,0.045) 75%),
linear-gradient(45deg, rgba(255,241,220,0.045) 25%, transparent 25% 75%, rgba(255,241,220,0.045) 75%);
background-size:64px 64px;
background-position:0 0, 32px 32px;
mask-image:linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0.25));
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(120deg, transparent 20%, rgba(255,241,220,0.06) 48%, transparent 66%);
animation:damasSweep 8.5s ease-in-out infinite;
}

.container{
width:min(100%, 900px);
max-width:900px;
min-width:0;
padding:0;
border:1px solid rgba(248,113,113,0.24);
border-radius:22px;
background:linear-gradient(145deg, rgba(28,17,19,0.96), rgba(9,10,15,0.95));
box-shadow:0 30px 90px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 12% 12%, rgba(239,68,68,0.16), transparent 28%),
radial-gradient(circle at 92% 88%, rgba(255,241,220,0.11), transparent 30%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1fr) minmax(285px, 1fr);
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(248,113,113,0.38);
border-radius:999px;
background:rgba(127,29,29,0.3);
color:#fecaca;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.55rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#fed7aa;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(248,113,113,0.18);
border-radius:16px;
background:rgba(2,6,23,0.32);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#fecaca;
font-weight:800;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #dc2626, #7f1d1d);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.damas-stage{
position:relative;
min-height:430px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
radial-gradient(circle at center, rgba(239,68,68,0.13), transparent 58%),
linear-gradient(180deg, rgba(127,29,29,0.13), rgba(2,6,23,0.25));
border-left:1px solid rgba(248,113,113,0.16);
overflow:hidden;
}

.damas-board{
position:relative;
width:min(340px, 100%);
aspect-ratio:1;
display:grid;
grid-template-columns:repeat(8, 1fr);
grid-template-rows:repeat(8, 1fr);
padding:10px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.17);
background:linear-gradient(145deg, rgba(127,29,29,0.5), rgba(31,41,55,0.78));
box-shadow:0 24px 70px rgba(2,6,23,0.44), 0 0 34px rgba(239,68,68,0.14);
transform:rotate(-2deg);
}

.sq{
position:relative;
display:grid;
place-items:center;
min-width:0;
}

.sq.light{background:var(--cream);}
.sq.dark{background:#7f1d1d;}
.sq:nth-child(1){border-top-left-radius:10px;}
.sq:nth-child(8){border-top-right-radius:10px;}
.sq:nth-child(57){border-bottom-left-radius:10px;}
.sq:nth-child(64){border-bottom-right-radius:10px;}

.checker{
width:72%;
aspect-ratio:1;
border-radius:50%;
border:3px solid rgba(255,255,255,0.22);
box-shadow:0 10px 16px rgba(0,0,0,0.28), inset 0 4px 8px rgba(255,255,255,0.2);
}

.checker.red{background:linear-gradient(145deg, #f87171, #991b1b);}
.checker.dark{background:linear-gradient(145deg, #475569, #0f172a);}
.checker.king::after{
content:"K";
display:grid;
place-items:center;
width:100%;
height:100%;
color:#fff7ed;
font-weight:900;
font-size:clamp(0.85rem, 3vw, 1.25rem);
}

.jump-line{
position:absolute;
width:200px;
height:3px;
background:linear-gradient(90deg, transparent, rgba(255,241,220,0.96), transparent);
transform:rotate(-43deg);
box-shadow:0 0 18px rgba(255,241,220,0.5);
animation:jumpPulse 2.8s ease-in-out infinite;
}

.floating-piece{
position:absolute;
display:grid;
place-items:center;
width:62px;
height:62px;
border-radius:50%;
border:3px solid rgba(255,255,255,0.18);
background:linear-gradient(145deg, #f87171, #991b1b);
box-shadow:0 18px 36px rgba(0,0,0,0.32);
animation:damasFloat 5s ease-in-out infinite;
}

.fp1{top:38px;right:28px;}
.fp2{bottom:48px;left:26px;animation-delay:-1.9s;background:linear-gradient(145deg, #475569, #0f172a);}
.fp3{bottom:96px;right:44px;animation-delay:-3.1s;}

@keyframes damasFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(6deg);}
}

@keyframes jumpPulse{
0%,100%{opacity:0.28;}
50%{opacity:0.9;}
}

@keyframes damasSweep{
0%,100%{transform:translateX(-20%);opacity:0.45;}
50%{transform:translateX(18%);opacity:0.78;}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.damas-stage{min-height:340px;border-left:none;border-top:1px solid rgba(248,113,113,0.16);padding:32px 18px 38px;}
.damas-board{width:min(292px, 92vw);transform:rotate(0deg);padding:8px;}
.floating-piece{width:50px;height:50px;}
.fp1{top:18px;right:16px;}
.fp2{bottom:18px;left:16px;}
.fp3{display:none;}
.jump-line{width:160px;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>

<body>
<main class="container" aria-label="Lobby de espera Damas">
  <div class="lobby-layout">
    <section class="lobby-copy">
      <span class="lobby-kicker">Lobby de espera</span>
      <h1>Damas</h1>
      <p class="subtitle">El salto decisivo se prepara antes de empezar. Mira las diagonales y espera la senal.</p>
      <div class="status-card">
        <p id="mensaje">Esperando que el torneo inicie...</p>
      </div>
      <div class="actions">
        <button class="musica-btn" onclick="manejarClickMusicaDamas(event)" ondblclick="abrirMenuMusicaDamas(event)">Musica</button>
      </div>
    </section>

    <section class="damas-stage" aria-hidden="true">
      <span class="floating-piece fp1"></span>
      <span class="floating-piece fp2"></span>
      <span class="floating-piece fp3"></span>
      <span class="jump-line"></span>
      <div class="damas-board">
        <span class="sq light"></span><span class="sq dark"><span class="checker dark"></span></span><span class="sq light"></span><span class="sq dark"><span class="checker dark"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span>
        <span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker dark"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker dark king"></span></span><span class="sq light"></span>
        <span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker red"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span>
        <span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker red"></span></span><span class="sq light"></span>
        <span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker dark"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span>
        <span class="sq dark"><span class="checker red king"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span>
        <span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker red"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker red"></span></span>
        <span class="sq dark"></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span><span class="sq dark"><span class="checker red"></span></span><span class="sq light"></span><span class="sq dark"></span><span class="sq light"></span>
      </div>
    </section>
  </div>
</main>

<audio id="damasMusicAudio">
  <source src="./music/damasmusic.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="../js/lobby.js"></script>
<script src="./js/damas-music.js"></script>
</body>
</html>
