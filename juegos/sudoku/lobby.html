<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Torneo</title>

<style>
body{
font-family: Arial;
text-align:center;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:16px;
box-sizing:border-box;
overflow-x:hidden;
}

.container{
background:#1e293b;
padding:30px;
border-radius:15px;
box-sizing:border-box;
max-width:100%;
}

h1{
margin-bottom:10px;
}

#mensaje{
margin-top:10px;
color:#94a3b8;
}

/* BOTÓN MÚSICA */
.musica-btn{
padding:12px 20px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:all 0.2s ease;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
background:linear-gradient(135deg, #8b5cf6, #7c3aed);
color:white;
margin-top:20px;
}

.musica-btn:hover{
transform:translateY(-2px) scale(1.05);
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.sudoku-music-menu{
position:fixed;
left:16px;
bottom:86px;
z-index:1200;
display:none;
width:min(300px, calc(100vw - 32px));
overflow:hidden;
border:1px solid rgba(139,92,246,0.34);
border-radius:14px;
background:rgba(15,23,42,0.97);
box-shadow:0 18px 48px rgba(0,0,0,0.4);
text-align:left;
}

.sudoku-music-menu.abierto{display:block;}

.sudoku-music-menu-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.sudoku-music-title{min-width:0;}
.sudoku-music-title strong{display:block;font-size:14px;line-height:1.2;}
.sudoku-music-title span{display:block;overflow:hidden;color:#cbd5e1;font-size:12px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap;}
.sudoku-music-close{flex:0 0 auto;width:30px;height:30px;border:1px solid rgba(255,255,255,0.14);border-radius:10px;color:white;background:rgba(255,255,255,0.1);cursor:pointer;font-size:18px;line-height:1;}
.sudoku-music-controls{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sudoku-music-shuffle{width:100%;border:1px solid rgba(139,92,246,0.38);border-radius:12px;padding:9px 10px;color:white;background:rgba(30,41,59,0.9);cursor:pointer;font:inherit;font-size:13px;font-weight:700;}
.sudoku-music-shuffle.activo{border-color:rgba(196,181,253,0.78);background:rgba(124,58,237,0.36);}
.sudoku-music-list{display:grid;gap:6px;max-height:min(300px, calc(100vh - 230px));overflow:auto;padding:10px 12px 12px;}
.sudoku-music-track{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:9px 10px;color:white;background:rgba(30,41,59,0.74);cursor:pointer;font:inherit;font-size:13px;text-align:left;}
.sudoku-music-track.activo{border-color:rgba(196,181,253,0.78);background:rgba(124,58,237,0.24);}
.sudoku-music-track span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sudoku-music-track small{flex:0 0 auto;color:#ddd6fe;font-size:11px;font-weight:800;}
.sudoku-music-menu{width:min(340px, calc(100vw - 28px));max-height:calc(100dvh - 96px);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.06);}
.sudoku-music-menu-head{padding:14px;}
.sudoku-music-title strong{font-size:15px;}
.sudoku-music-close{min-width:34px;min-height:34px;}
.sudoku-music-controls{padding:12px 14px;}
.sudoku-music-shuffle{min-height:42px;border-radius:10px;}
.sudoku-music-list{gap:8px;max-height:min(360px, calc(100dvh - 230px));padding:12px 14px 14px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(196,181,253,0.56) rgba(15,23,42,0.42);}
.sudoku-music-list::-webkit-scrollbar{width:8px;}
.sudoku-music-list::-webkit-scrollbar-track{background:rgba(15,23,42,0.42);border-radius:999px;}
.sudoku-music-list::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(196,181,253,0.56);}
.sudoku-music-track{min-height:46px;border-radius:10px;padding:10px 12px;}
.sudoku-music-track:hover{border-color:rgba(196,181,253,0.48);background:rgba(51,65,85,0.8);}
.sudoku-music-track:focus-visible,.sudoku-music-shuffle:focus-visible,.sudoku-music-close:focus-visible{outline:2px solid rgba(196,181,253,0.78);outline-offset:2px;}

@media (max-width:500px){
.container{
padding:22px 16px;
width:100%;
max-width:min(420px, 100%);
}
.sudoku-music-menu{left:12px;right:12px;bottom:78px;width:auto;max-height:calc(100dvh - 92px);}
.sudoku-music-list{max-height:calc(100dvh - 244px);}
.sudoku-music-track{min-height:48px;font-size:14px;}
}
</style>
<style>
html, body{width:100%;max-width:100%;overflow-x:hidden;}
.container{width:100%;max-width:420px;min-width:0;}
h1,#mensaje,button{overflow-wrap:anywhere;}
.musica-btn{max-width:100%;}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>

<body>

<div class="container">
<h1>🎮 Torneo de Juegos</h1>
<p id="mensaje">Esperando que el torneo inicie...</p>
<button class="musica-btn" onclick="manejarClickMusicaSudoku(event)" ondblclick="abrirMenuMusicaSudoku(event)">🎵 Música</button>
</div>

<audio id="sudokuMusicAudio">
  <source src="./music/musicasudoku.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="../js/lobby.js"></script>

<script src="./js/sudoku-music.js"></script>

</body>

</html>
