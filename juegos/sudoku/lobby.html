<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Sudoku</title>

<link rel="stylesheet" href="../css/responsive-desktop.css">
<style>
:root{
--bg:#07111f;
--panel:#0d1829;
--panel-soft:rgba(15,23,42,0.78);
--line:rgba(148,163,184,0.26);
--text:#f8fafc;
--muted:#a8b5c7;
--cyan:#67e8f9;
--gold:#f7d77b;
--blue:#2563eb;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 16% 16%, rgba(103,232,249,0.2), transparent 30%),
radial-gradient(circle at 78% 18%, rgba(247,215,123,0.18), transparent 28%),
linear-gradient(135deg, #050914 0%, var(--bg) 48%, #111827 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(rgba(148,163,184,0.055) 1px, transparent 1px),
linear-gradient(90deg, rgba(148,163,184,0.055) 1px, transparent 1px);
background-size:54px 54px;
mask-image:linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0.2));
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(120deg, transparent 15%, rgba(255,255,255,0.06) 45%, transparent 58%);
animation:sudokuSweep 9s ease-in-out infinite;
opacity:0.55;
}

.container{
width:min(100%, 860px);
max-width:860px;
min-width:0;
padding:0;
border:1px solid rgba(148,163,184,0.22);
border-radius:22px;
background:linear-gradient(145deg, rgba(15,23,42,0.94), rgba(8,15,28,0.94));
box-shadow:0 30px 90px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 12% 10%, rgba(103,232,249,0.16), transparent 26%),
radial-gradient(circle at 92% 86%, rgba(247,215,123,0.12), transparent 28%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1.08fr) minmax(260px, 0.92fr);
gap:0;
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(103,232,249,0.28);
border-radius:999px;
background:rgba(8,47,73,0.34);
color:#cffafe;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.6rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#cbd5e1;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(148,163,184,0.2);
border-radius:16px;
background:rgba(2,6,23,0.36);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#dbeafe;
font-weight:700;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #0891b2, #2563eb);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.sudoku-stage{
position:relative;
min-height:420px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
linear-gradient(180deg, rgba(15,23,42,0.16), rgba(2,6,23,0.28)),
radial-gradient(circle at center, rgba(103,232,249,0.16), transparent 56%);
border-left:1px solid rgba(148,163,184,0.16);
overflow:hidden;
}

.sudoku-board{
width:min(330px, 100%);
aspect-ratio:1;
display:grid;
grid-template-columns:repeat(9, 1fr);
grid-template-rows:repeat(9, 1fr);
border:3px solid rgba(248,250,252,0.88);
border-radius:14px;
overflow:hidden;
background:rgba(248,250,252,0.95);
box-shadow:0 24px 70px rgba(2,6,23,0.44), 0 0 34px rgba(103,232,249,0.16);
transform:rotate(-2deg);
}

.cell{
display:grid;
place-items:center;
border-right:1px solid rgba(15,23,42,0.16);
border-bottom:1px solid rgba(15,23,42,0.16);
color:#0f172a;
font-size:clamp(15px, 4vw, 25px);
font-weight:900;
background:rgba(255,255,255,0.94);
}

.cell:nth-child(3n){border-right:2px solid rgba(15,23,42,0.72);}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid rgba(15,23,42,0.72);}
.cell:nth-child(odd){background:#f8fafc;}
.cell.empty{color:transparent;background:#e0f2fe;}
.cell.mark{background:#fef3c7;color:#92400e;}

.sudoku-chip{
position:absolute;
display:grid;
place-items:center;
width:58px;
height:58px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.22);
background:rgba(15,23,42,0.74);
color:#cffafe;
font-size:24px;
font-weight:900;
box-shadow:0 18px 36px rgba(0,0,0,0.3);
animation:sudokuFloat 4.8s ease-in-out infinite;
}

.chip-a{top:36px;right:24px;}
.chip-b{bottom:42px;left:24px;animation-delay:-1.6s;color:#fde68a;}
.chip-c{bottom:88px;right:42px;animation-delay:-3s;}

.sudoku-music-menu{
position:fixed;
left:16px;
bottom:86px;
z-index:1200;
display:none;
width:min(340px, calc(100vw - 28px));
max-height:calc(100dvh - 96px);
overflow:hidden;
border:1px solid rgba(103,232,249,0.34);
border-radius:14px;
background:rgba(15,23,42,0.97);
box-shadow:0 24px 70px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.06);
text-align:left;
}

.sudoku-music-menu.abierto{display:block;}
.sudoku-music-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sudoku-music-title{min-width:0;}
.sudoku-music-title strong{display:block;font-size:15px;line-height:1.2;}
.sudoku-music-title span{display:block;overflow:hidden;color:#cbd5e1;font-size:12px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap;}
.sudoku-music-close{flex:0 0 auto;width:34px;min-width:34px;height:34px;min-height:34px;border:1px solid rgba(255,255,255,0.14);border-radius:10px;color:white;background:rgba(255,255,255,0.1);cursor:pointer;font-size:18px;line-height:1;}
.sudoku-music-controls{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sudoku-music-shuffle{width:100%;min-height:42px;border:1px solid rgba(103,232,249,0.38);border-radius:10px;padding:9px 10px;color:white;background:rgba(14,116,144,0.34);cursor:pointer;font:inherit;font-size:13px;font-weight:700;}
.sudoku-music-shuffle.activo{border-color:rgba(165,243,252,0.82);background:rgba(8,145,178,0.28);}
.sudoku-music-list{display:grid;gap:8px;max-height:min(360px, calc(100dvh - 230px));overflow:auto;padding:12px 14px 14px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(103,232,249,0.58) rgba(15,23,42,0.42);}
.sudoku-music-list::-webkit-scrollbar{width:8px;}
.sudoku-music-list::-webkit-scrollbar-track{background:rgba(15,23,42,0.42);border-radius:999px;}
.sudoku-music-list::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(103,232,249,0.58);}
.sudoku-music-track{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:white;background:rgba(30,41,59,0.74);cursor:pointer;font:inherit;font-size:13px;text-align:left;}
.sudoku-music-track.activo{border-color:rgba(165,243,252,0.78);background:rgba(8,145,178,0.18);}
.sudoku-music-track:hover{border-color:rgba(165,243,252,0.5);background:rgba(51,65,85,0.8);}
.sudoku-music-track span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sudoku-music-track small{flex:0 0 auto;color:#a5f3fc;font-size:11px;font-weight:800;}
.sudoku-music-track:focus-visible,.sudoku-music-shuffle:focus-visible,.sudoku-music-close:focus-visible{outline:2px solid rgba(165,243,252,0.78);outline-offset:2px;}

@keyframes sudokuFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(5deg);}
}

@keyframes sudokuSweep{
0%,100%{transform:translateX(-24%);}
50%{transform:translateX(20%);}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.sudoku-stage{min-height:310px;border-left:none;border-top:1px solid rgba(148,163,184,0.16);padding:28px 18px 34px;}
.sudoku-board{width:min(280px, 92vw);transform:rotate(0deg);}
.sudoku-chip{width:48px;height:48px;font-size:20px;}
.chip-a{top:18px;right:16px;}
.chip-b{bottom:20px;left:16px;}
.chip-c{display:none;}
.sudoku-music-menu{left:12px;right:12px;bottom:78px;width:auto;max-height:calc(100dvh - 92px);}
.sudoku-music-list{max-height:calc(100dvh - 244px);}
.sudoku-music-track{min-height:48px;font-size:14px;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>

<body>

<main class="container" aria-label="Lobby de espera Sudoku">
  <div class="lobby-layout">
    <section class="lobby-copy">
      <span class="lobby-kicker">Lobby de espera</span>

      <p class="subtitle">El tablero esta listo. Afina la mirada, respira y espera la senal del torneo.</p>

        <span class="cell empty">0</span><span class="cell">9</span><span class="cell">8</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">6</span><span class="cell empty">0</span>
        <span class="cell">8</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">6</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">3</span>
        <span class="cell">4</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">8</span><span class="cell empty">0</span><span class="cell">3</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">1</span>
        <span class="cell">7</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">2</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">6</span>
        <span class="cell empty">0</span><span class="cell">6</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">2</span><span class="cell">8</span><span class="cell empty">0</span>
        <span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">4</span><span class="cell">1</span><span class="cell">9</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">5</span>
        <span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">8</span><span class="cell empty">0</span><span class="cell empty">0</span><span class="cell">7</span><span class="cell">9</span>
      </div>
    </section>
  </div>
</main>

<audio id="sudokuMusicAudio">
  <source src="./music/musicasudoku.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="../js/lobby.js"></script>
<script src="./js/sudoku-music.js"></script>

</body>

</html>
