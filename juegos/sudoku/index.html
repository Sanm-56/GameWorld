<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso Sudoku</title>
<style>
:root{--bg:#071426;--panel:rgba(9,25,49,.82);--line:rgba(96,165,250,.28);--text:#eff6ff;--muted:#bfdbfe;--accent:#38bdf8;--accent2:#22c55e}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.22),transparent 30%),radial-gradient(circle at 88% 82%,rgba(34,197,94,.18),transparent 28%),linear-gradient(145deg,#061121,#102f4c)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(147,197,253,.08) 1px,transparent 1px),linear-gradient(0deg,rgba(147,197,253,.08) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(2,6,23,.62);box-shadow:0 28px 80px rgba(0,0,0,.42)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 8%,rgba(125,211,252,.22),transparent 32%),linear-gradient(180deg,rgba(15,23,42,.25),rgba(8,47,73,.62))}
.sudoku-board{position:absolute;left:50%;top:50%;width:min(78%,430px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(-4deg);display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:3px solid rgba(226,246,255,.72);box-shadow:0 24px 60px rgba(0,0,0,.34),0 0 38px rgba(56,189,248,.2);background:rgba(2,6,23,.38)}
.cell{display:grid;place-items:center;border:1px solid rgba(191,219,254,.24);color:#e0f2fe;font-size:clamp(12px,2vw,22px);font-weight:900}
.cell:nth-child(3n){border-right-color:rgba(226,246,255,.62)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom-color:rgba(226,246,255,.62)}
.cell.hot{background:linear-gradient(135deg,rgba(56,189,248,.32),rgba(34,197,94,.18));color:white;animation:sudokuPulse 2.8s ease-in-out infinite}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 32%),rgba(2,6,23,.74)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(56,189,248,.42);border-radius:999px;padding:8px 12px;color:#86efac;background:rgba(2,6,23,.45);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}
.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(96,165,250,.34);outline:none;color:var(--text);background:rgba(2,6,23,.62);font:inherit}input::placeholder{color:#93c5fd}input:focus{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.16)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:#03120b;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(56,189,248,.22)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes sudokuPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@media (prefers-reduced-motion:reduce){.cell.hot{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.sudoku-board{width:86%}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell">
  <section class="visual" aria-hidden="true">
    <div class="sudoku-board">
      <span class="cell hot">5</span><span class="cell"></span><span class="cell">3</span><span class="cell"></span><span class="cell">7</span><span class="cell"></span><span class="cell hot">9</span><span class="cell"></span><span class="cell">1</span>
      <span class="cell"></span><span class="cell hot">6</span><span class="cell"></span><span class="cell">1</span><span class="cell"></span><span class="cell">5</span><span class="cell"></span><span class="cell">8</span><span class="cell"></span>
      <span class="cell">1</span><span class="cell"></span><span class="cell">8</span><span class="cell"></span><span class="cell hot">4</span><span class="cell"></span><span class="cell"></span><span class="cell">6</span><span class="cell"></span>
      <span class="cell"></span><span class="cell">8</span><span class="cell"></span><span class="cell hot">7</span><span class="cell"></span><span class="cell">1</span><span class="cell"></span><span class="cell"></span><span class="cell">3</span>
      <span class="cell">4</span><span class="cell"></span><span class="cell"></span><span class="cell">8</span><span class="cell hot">5</span><span class="cell">3</span><span class="cell"></span><span class="cell"></span><span class="cell">1</span>
      <span class="cell">7</span><span class="cell"></span><span class="cell"></span><span class="cell">9</span><span class="cell"></span><span class="cell hot">2</span><span class="cell"></span><span class="cell">4</span><span class="cell"></span>
      <span class="cell"></span><span class="cell">6</span><span class="cell"></span><span class="cell"></span><span class="cell">3</span><span class="cell"></span><span class="cell">2</span><span class="cell"></span><span class="cell hot">8</span>
      <span class="cell"></span><span class="cell">4</span><span class="cell"></span><span class="cell">5</span><span class="cell"></span><span class="cell">9</span><span class="cell"></span><span class="cell hot">7</span><span class="cell"></span>
      <span class="cell hot">9</span><span class="cell"></span><span class="cell">2</span><span class="cell"></span><span class="cell">8</span><span class="cell"></span><span class="cell">6</span><span class="cell"></span><span class="cell">4</span>
    </div>
  </section>
  <section class="panel">
    <span class="kicker">Logica de torneo</span>
    <h1>Sudoku</h1>
    <p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p>
    <div class="fields">
      <label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label>
      <label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label>
    </div>
    <div class="actions">
      <button class="primary" onclick="entrar()">Entrar</button>
      <button class="back" onclick="window.location.href='../../index.html'">Volver</button>
    </div>
  </section>
</main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
