<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Arcade</title>
  <link rel="stylesheet" href="../css/arcade.css">
</head>
<body data-game="basketballarcade" data-screen="login">
  <main class="arcade-login basket-login">
    <section class="login-hero" aria-hidden="true">
      <div class="basket-court">
        <span class="court-lines"></span>
        <span class="basket-backboard"></span>
        <span class="basket-rim"></span>
        <span class="basket-net"></span>
        <span class="basket-ball ball-a"></span>
        <span class="basket-ball ball-b"></span>
        <span class="score-flash">+3</span>
      </div>
    </section>

    <section class="login-panel">
      <span class="login-kicker">Cancha competitiva</span>
      <h1>Basketball Arcade</h1>
      <p>Entra con tu apodo y codigo unico para lanzar en el torneo.</p>

      <div class="login-fields">
        <label>
          <span>Jugador</span>
          <input id="usuario" autocomplete="nickname" placeholder="Tu apodo">
        </label>
        <label>
          <span>Codigo unico</span>
          <input id="codigo" autocomplete="one-time-code" placeholder="Ej: BSK-3024">
        </label>
      </div>

      <div class="login-actions">
        <button class="login-primary" onclick="entrar()">Entrar a la cancha</button>
        <button class="login-secondary" onclick="window.location.href='../../index.html'">Volver</button>
      </div>
    </section>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
