<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso Memoria</title>
<style>
:root{--text:#fff7fb;--muted:#fbcfe8;--accent:#db2777;--accent2:#7c3aed;--line:rgba(244,114,182,.3)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 12%,rgba(244,114,182,.22),transparent 30%),radial-gradient(circle at 84% 82%,rgba(124,58,237,.24),transparent 30%),linear-gradient(145deg,#180c2f,#35135b 58%,#12091f)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%),linear-gradient(135deg,rgba(255,255,255,.035) 25%,transparent 25%);background-size:34px 34px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(16,8,34,.7);box-shadow:0 28px 80px rgba(0,0,0,.42)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 0,rgba(244,114,182,.25),transparent 34%),linear-gradient(180deg,rgba(124,58,237,.22),rgba(22,7,45,.72))}
.memory-grid{position:absolute;left:50%;top:50%;width:min(78%,430px);transform:translate(-50%,-50%) rotate(3deg);display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{aspect-ratio:.78;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:linear-gradient(145deg,rgba(219,39,119,.95),rgba(124,58,237,.82));box-shadow:0 20px 34px rgba(0,0,0,.28);position:relative;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:linear-gradient(135deg,transparent,rgba(255,255,255,.14),transparent)}
.card.face{display:grid;place-items:center;background:linear-gradient(145deg,#fdf2f8,#c4b5fd);color:#4c1d95;font-size:clamp(22px,4vw,36px);font-weight:1000;animation:memoryFlip 3.4s ease-in-out infinite}.card.face::before{display:none}.card.delay{animation-delay:.8s}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.075),transparent 32%),rgba(18,8,36,.78)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(244,114,182,.44);border-radius:999px;padding:8px 12px;color:#f9a8d4;background:rgba(2,6,23,.35);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(244,114,182,.34);outline:none;color:var(--text);background:rgba(2,6,23,.56);font:inherit}input::placeholder{color:#f9a8d4}input:focus{border-color:#db2777;box-shadow:0 0 0 4px rgba(219,39,119,.18)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(219,39,119,.26)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes memoryFlip{0%,68%,100%{transform:rotateY(0)}78%,92%{transform:rotateY(180deg) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.card.face{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.memory-grid{width:86%;gap:9px}.card{border-radius:13px}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell">
  <section class="visual" aria-hidden="true">
    <div class="memory-grid">
      <span class="card"></span><span class="card face">7</span><span class="card"></span><span class="card"></span>
      <span class="card face delay">A</span><span class="card"></span><span class="card"></span><span class="card face">7</span>
      <span class="card"></span><span class="card"></span><span class="card face delay">A</span><span class="card"></span>
    </div>
  </section>
  <section class="panel">
    <span class="kicker">Concentracion visual</span>
    <h1>Memoria</h1>
    <p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p>
    <div class="fields">
      <label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label>
      <label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label>
    </div>
    <div class="actions">
      <button class="primary" onclick="entrar()">Entrar</button>
      <button class="back" onclick="window.location.href='../../index.html'">Volver</button>
    </div>
  </section>
</main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
