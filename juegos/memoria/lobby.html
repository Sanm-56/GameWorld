<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Memoria</title>

<link rel="stylesheet" href="../css/responsive-desktop.css">
<style>
:root{
--bg:#10091c;
--panel:#171126;
--text:#fff7fb;
--muted:#d8c7df;
--rose:#f472b6;
--violet:#8b5cf6;
--amber:#fbbf24;
--mint:#5eead4;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 20% 18%, rgba(244,114,182,0.2), transparent 30%),
radial-gradient(circle at 82% 24%, rgba(94,234,212,0.16), transparent 27%),
linear-gradient(135deg, #080512 0%, var(--bg) 50%, #14111f 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px),
repeating-linear-gradient(-45deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 50px);
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(120deg, transparent 18%, rgba(255,255,255,0.06) 48%, transparent 64%);
animation:memoryLight 8s ease-in-out infinite;
opacity:0.65;
}

.container{
width:min(100%, 900px);
max-width:900px;
min-width:0;
padding:0;
border:1px solid rgba(244,114,182,0.2);
border-radius:22px;
background:linear-gradient(145deg, rgba(23,17,38,0.96), rgba(12,10,26,0.95));
box-shadow:0 30px 90px rgba(0,0,0,0.44), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 14% 12%, rgba(244,114,182,0.16), transparent 28%),
radial-gradient(circle at 90% 86%, rgba(94,234,212,0.12), transparent 28%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1fr) minmax(280px, 0.98fr);
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(244,114,182,0.34);
border-radius:999px;
background:rgba(131,24,67,0.32);
color:#fce7f3;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.55rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#f5d0fe;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(244,114,182,0.18);
border-radius:16px;
background:rgba(2,6,23,0.3);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#fbcfe8;
font-weight:800;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #db2777, #7c3aed);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.memory-stage{
position:relative;
min-height:430px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
radial-gradient(circle at center, rgba(244,114,182,0.14), transparent 58%),
linear-gradient(180deg, rgba(76,29,149,0.18), rgba(2,6,23,0.22));
border-left:1px solid rgba(244,114,182,0.14);
overflow:hidden;
}

.memory-ring{
position:absolute;
width:min(360px, 86%);
aspect-ratio:1;
border-radius:50%;
border:1px solid rgba(251,207,232,0.18);
animation:memorySpin 18s linear infinite;
}

.memory-ring::before,
.memory-ring::after{
content:"";
position:absolute;
width:16px;
height:16px;
border-radius:6px;
background:var(--mint);
box-shadow:0 0 24px rgba(94,234,212,0.65);
}

.memory-ring::before{top:14%;left:14%;}
.memory-ring::after{right:16%;bottom:14%;background:var(--amber);box-shadow:0 0 24px rgba(251,191,36,0.6);}

.memory-grid{
position:relative;
width:min(340px, 100%);
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:12px;
padding:16px;
border:1px solid rgba(255,255,255,0.16);
border-radius:20px;
background:rgba(15,23,42,0.68);
box-shadow:0 24px 70px rgba(2,6,23,0.44), 0 0 34px rgba(244,114,182,0.14);
transform:rotate(-2deg);
}

.card-tile{
position:relative;
aspect-ratio:1;
display:grid;
place-items:center;
border-radius:14px;
border:1px solid rgba(255,255,255,0.14);
background:
linear-gradient(135deg, rgba(244,114,182,0.24), rgba(139,92,246,0.18)),
rgba(15,23,42,0.88);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.09), 0 12px 22px rgba(0,0,0,0.2);
color:#fce7f3;
font-size:clamp(1rem, 4vw, 1.55rem);
font-weight:900;
overflow:hidden;
}

.card-tile::before{
content:"";
position:absolute;
inset:8px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.12);
}

.card-tile.revealed{
background:#fff7ed;
color:#7c2d12;
transform:translateY(-5px);
}

.card-tile.match{
background:#ccfbf1;
color:#0f766e;
}

.memory-badge{
position:absolute;
display:inline-flex;
align-items:center;
justify-content:center;
min-width:58px;
height:42px;
padding:0 12px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.18);
background:rgba(15,23,42,0.74);
color:#fef3c7;
font-weight:900;
box-shadow:0 16px 32px rgba(0,0,0,0.26);
animation:memoryFloat 5s ease-in-out infinite;
}

.b1{top:42px;right:30px;}
.b2{bottom:52px;left:24px;animation-delay:-1.8s;color:#ccfbf1;}
.b3{bottom:96px;right:42px;animation-delay:-3.1s;color:#fbcfe8;}

@keyframes memoryFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(5deg);}
}

@keyframes memorySpin{
to{transform:rotate(360deg);}
}

@keyframes memoryLight{
0%,100%{transform:translateX(-20%);opacity:0.45;}
50%{transform:translateX(18%);opacity:0.78;}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.memory-stage{min-height:330px;border-left:none;border-top:1px solid rgba(244,114,182,0.14);padding:30px 18px 36px;}
.memory-grid{width:min(292px, 92vw);gap:9px;padding:12px;transform:rotate(0deg);}
.memory-badge{min-width:50px;height:36px;font-size:14px;}
.b1{top:18px;right:16px;}
.b2{bottom:18px;left:16px;}
.b3{display:none;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>

<body>

<main class="container" aria-label="Lobby de espera Memoria">
  <div class="lobby-layout">
    <section class="lobby-copy">
      <span class="lobby-kicker">Lobby de espera</span>
      <h1>Memoria</h1>
      <p class="subtitle">Observa los patrones, guarda las parejas y espera el inicio con la mente despierta.</p>
      <div class="status-card">
        <p id="mensaje">Esperando que el torneo inicie...</p>
      </div>
      <div class="actions">
        <button class="musica-btn" onclick="manejarClickMusicaMemoria(event)" ondblclick="abrirMenuMusicaMemoria(event)">Musica</button>
      </div>
    </section>

    <section class="memory-stage" aria-hidden="true">
      <div class="memory-ring"></div>
      <span class="memory-badge b1">2x</span>
      <span class="memory-badge b2">MATCH</span>
      <span class="memory-badge b3">+8</span>
      <div class="memory-grid">
        <span class="card-tile revealed">A</span><span class="card-tile">?</span><span class="card-tile match">7</span><span class="card-tile">?</span>
        <span class="card-tile">?</span><span class="card-tile revealed">A</span><span class="card-tile">?</span><span class="card-tile match">7</span>
        <span class="card-tile">?</span><span class="card-tile">?</span><span class="card-tile revealed">K</span><span class="card-tile">?</span>
        <span class="card-tile match">3</span><span class="card-tile">?</span><span class="card-tile">?</span><span class="card-tile match">3</span>
      </div>
    </section>
  </div>
</main>

<audio id="memoriaMusicAudio">
  <source src="./music/musicamemoria.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script type="module" src="../js/lobby.js"></script>
<script src="./js/memoria-music.js"></script>

</body>

</html>
