<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby Esquiva Obstaculos</title>
  <link rel="stylesheet" href="../css/arcade.css">
  <style>
    :root{
      --dodge-bg:#050816;
      --dodge-panel:#07111f;
      --dodge-cyan:#38bdf8;
      --dodge-pink:#fb7185;
      --dodge-blue:#2563eb;
    }

    body{
      --accent:#38bdf8;
      --secondary:#fb7185;
      background:
        radial-gradient(circle at 16% 14%, rgba(56,189,248,.22), transparent 30%),
        radial-gradient(circle at 84% 82%, rgba(251,113,133,.2), transparent 28%),
        linear-gradient(150deg, #050816, #10112c 55%, #07111f);
    }

    body::before{
      background:
        linear-gradient(90deg, rgba(56,189,248,.07) 1px, transparent 1px),
        linear-gradient(rgba(251,113,133,.045) 1px, transparent 1px);
      background-size:54px 54px;
      mask-image:linear-gradient(180deg, black, transparent 84%);
    }

    .container.dodge-lobby{
      width:min(960px, 100%);
      max-width:960px;
      min-width:0;
      padding:0;
      border:1px solid rgba(56,189,248,.25);
      border-radius:26px;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 0, rgba(56,189,248,.18), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(251,113,133,.16), transparent 30%),
        linear-gradient(145deg, rgba(7,17,31,.96), rgba(2,6,23,.9));
      box-shadow:0 30px 90px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .dodge-lobby-layout{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(300px, .98fr);
      align-items:stretch;
      position:relative;
      z-index:1;
    }

    .dodge-copy{
      padding:clamp(26px, 4vw, 48px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      min-width:0;
    }

    .lobby-kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border:1px solid rgba(125,211,252,.38);
      border-radius:999px;
      color:#bae6fd;
      background:rgba(8,47,73,.34);
      font-size:12px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    h1{
      margin:18px 0 10px;
      font-size:clamp(2rem, 5vw, 4.2rem);
      line-height:.95;
      overflow-wrap:anywhere;
    }

    .subtitle{
      max-width:520px;
      margin:0 0 20px;
      color:#dbeafe;
      font-size:clamp(.98rem, 2vw, 1.08rem);
      line-height:1.55;
    }

    .status-card{
      width:100%;
      max-width:520px;
      margin:0 0 18px;
      padding:14px 16px;
      border:1px solid rgba(125,211,252,.2);
      border-radius:16px;
      background:rgba(2,6,23,.34);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    #mensaje{
      margin:0;
      color:#bae6fd;
      font-weight:900;
      line-height:1.45;
      overflow-wrap:anywhere;
    }

    .dodge-scene{
      position:relative;
      min-height:430px;
      display:grid;
      place-items:center;
      padding:clamp(24px, 4vw, 44px);
      border-left:1px solid rgba(125,211,252,.16);
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 88%, rgba(56,189,248,.22), transparent 34%),
        linear-gradient(180deg, rgba(251,113,133,.1), transparent 30%),
        linear-gradient(180deg, #090b22, #07111f);
    }

    .road-card{
      position:relative;
      width:min(350px, 100%);
      height:330px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:24px;
      overflow:hidden;
      background:
        repeating-linear-gradient(180deg, transparent 0 32px, rgba(56,189,248,.16) 32px 38px, transparent 38px 76px),
        linear-gradient(90deg, rgba(56,189,248,.08), rgba(251,113,133,.08), rgba(56,189,248,.08)),
        rgba(2,6,23,.58);
      box-shadow:0 24px 70px rgba(2,6,23,.44), 0 0 34px rgba(56,189,248,.14);
      clip-path:polygon(34% 0, 66% 0, 100% 100%, 0 100%);
      animation:roadFlow 1.05s linear infinite;
    }

    .road-card::before,
    .road-card::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:2px;
      background:linear-gradient(180deg, transparent, rgba(125,211,252,.72), transparent);
    }

    .road-card::before{left:38%;}
    .road-card::after{right:38%;}

    .ship-lobby{
      position:absolute;
      left:50%;
      bottom:42px;
      width:58px;
      height:66px;
      transform:translateX(-50%);
      border-radius:18px 18px 28px 28px;
      background:
        radial-gradient(circle at 50% 18%, #e0f2fe, transparent 18%),
        linear-gradient(135deg, #38bdf8, #0369a1);
      box-shadow:0 22px 42px rgba(0,0,0,.38), 0 0 30px rgba(56,189,248,.42);
      animation:shipPulse 2.7s ease-in-out infinite;
      z-index:2;
    }

    .ship-lobby::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:-15px;
      width:30px;
      height:18px;
      transform:translateX(-50%);
      border-radius:999px;
      background:rgba(56,189,248,.28);
      filter:blur(4px);
    }

    .threat-lobby{
      position:absolute;
      width:48px;
      height:48px;
      transform:rotate(45deg);
      border-radius:12px;
      background:linear-gradient(135deg, #fb7185, #be123c);
      box-shadow:0 18px 32px rgba(0,0,0,.32), 0 0 24px rgba(251,113,133,.34);
      z-index:3;
    }

    .threat-a{left:22%;top:22%;}
    .threat-b{right:24%;top:42%;border-radius:50% 18% 50% 18%;}
    .threat-c{left:50%;top:12%;clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);}

    .warning-chip{
      position:absolute;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:66px;
      height:42px;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(15,23,42,.76);
      color:#bae6fd;
      font-weight:1000;
      box-shadow:0 16px 32px rgba(0,0,0,.26);
      animation:warningFloat 5s ease-in-out infinite;
    }

    .warn-a{top:40px;right:30px;}
    .warn-b{bottom:52px;left:24px;color:#fecdd3;animation-delay:-1.8s;}
    .warn-c{bottom:96px;right:42px;color:#dbeafe;animation-delay:-3.1s;}

    @keyframes roadFlow{
      to{background-position:0 76px, 0 0, 0 0;}
    }

    @keyframes shipPulse{
      0%,100%{transform:translateX(-50%) translateY(0);}
      50%{transform:translateX(-50%) translateY(-10px);}
    }

    @keyframes warningFloat{
      0%,100%{transform:translateY(0) rotate(0);}
      50%{transform:translateY(-12px) rotate(-5deg);}
    }

    @media (max-width:760px){
      body{align-items:flex-start;padding:14px;}
      .dodge-lobby-layout{grid-template-columns:1fr;}
      .dodge-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
      .subtitle{max-width:440px;}
      .dodge-scene{min-height:340px;border-left:0;border-top:1px solid rgba(125,211,252,.16);padding:32px 18px 38px;}
      .road-card{width:min(292px, 92vw);height:286px;}
      .warning-chip{min-width:54px;height:36px;font-size:14px;}
      .warn-a{top:18px;right:16px;}
      .warn-b{bottom:18px;left:16px;}
      .warn-c{display:none;}
      .threat-lobby{width:40px;height:40px;}
      .ship-lobby{width:50px;height:58px;}
    }
  </style>
</head>
<body data-game="esquivaobstaculos">
  <main class="final-card container dodge-lobby" aria-label="Lobby de espera Esquiva Obstaculos">
    <div class="dodge-lobby-layout">
      <section class="dodge-copy">
        <span class="lobby-kicker">Lobby de espera</span>
        <h1>Esquiva Obstaculos</h1>
        <p class="subtitle">La pista ya se mueve. Prepara los reflejos, lee las rutas y espera la senal de salida.</p>
        <div class="status-card">
          <p id="mensaje">Esperando que el torneo inicie...</p>
        </div>
      </section>

      <section class="dodge-scene" aria-hidden="true">
        <span class="warning-chip warn-a">DODGE</span>
        <span class="warning-chip warn-b">+VIDA</span>
        <span class="warning-chip warn-c">COMBO</span>
        <div class="road-card">
          <span class="threat-lobby threat-a"></span>
          <span class="threat-lobby threat-b"></span>
          <span class="threat-lobby threat-c"></span>
          <span class="ship-lobby"></span>
        </div>
      </section>
    </div>
  </main>
  <button class="musica-btn dodge-music-btn" type="button" onclick="manejarClickMusicaDodge(event)" ondblclick="abrirMenuMusicaDodge(event)">Musica</button>
  <audio id="dodgeMusicAudio">
    <source src="./music/Buss Busss.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <script type="module" src="../js/lobby.js"></script>
  <script src="./js/esquivaobstaculos-music.js"></script>
</body>
</html>
