<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby Sube la Montana</title>
  <link rel="stylesheet" href="../css/arcade.css">
  <style>
    body{
      --accent:#f59e0b;
      --secondary:#38bdf8;
      background:
        radial-gradient(circle at 16% 12%, rgba(56,189,248,.2), transparent 30%),
        radial-gradient(circle at 84% 82%, rgba(245,158,11,.18), transparent 28%),
        linear-gradient(150deg, #09213b, #0f3554 52%, #1b140a);
    }

    body::before{
      background:
        radial-gradient(circle at 22% 18%, rgba(255,255,255,.24), transparent 10%),
        radial-gradient(circle at 78% 30%, rgba(255,255,255,.16), transparent 9%),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size:auto, auto, 58px 58px;
      mask-image:linear-gradient(180deg, black, transparent 86%);
    }

    .container.climb-lobby{
      width:min(960px, 100%);
      max-width:960px;
      min-width:0;
      padding:0;
      border:1px solid rgba(254,215,170,.28);
      border-radius:26px;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 0, rgba(56,189,248,.18), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(245,158,11,.16), transparent 30%),
        linear-gradient(145deg, rgba(9,33,59,.96), rgba(2,6,23,.88));
      box-shadow:0 30px 90px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .climb-lobby-layout{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(300px, .98fr);
      align-items:stretch;
      position:relative;
      z-index:1;
    }

    .climb-copy{
      padding:clamp(26px, 4vw, 48px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      min-width:0;
    }

    .lobby-kicker{
      display:inline-flex;
      align-items:center;
      padding:7px 10px;
      border:1px solid rgba(254,215,170,.4);
      border-radius:999px;
      color:#fed7aa;
      background:rgba(180,83,9,.28);
      font-size:12px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    h1{
      margin:18px 0 10px;
      font-size:clamp(2rem, 5vw, 4.2rem);
      line-height:.95;
      overflow-wrap:anywhere;
    }

    .subtitle{
      max-width:520px;
      margin:0 0 20px;
      color:#e0f2fe;
      font-size:clamp(.98rem, 2vw, 1.08rem);
      line-height:1.55;
    }

    .status-card{
      width:100%;
      max-width:520px;
      margin:0 0 18px;
      padding:14px 16px;
      border:1px solid rgba(254,215,170,.2);
      border-radius:16px;
      background:rgba(2,6,23,.34);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    #mensaje{
      margin:0;
      color:#fed7aa;
      font-weight:900;
      line-height:1.45;
      overflow-wrap:anywhere;
    }

    .climb-scene{
      position:relative;
      min-height:440px;
      display:grid;
      place-items:center;
      padding:clamp(24px, 4vw, 44px);
      border-left:1px solid rgba(254,215,170,.16);
      overflow:hidden;
      background:
        radial-gradient(ellipse at 18% 16%, rgba(255,255,255,.36), transparent 12%),
        radial-gradient(ellipse at 72% 26%, rgba(255,255,255,.24), transparent 11%),
        linear-gradient(180deg, #bae6fd 0%, #38bdf8 34%, #2563eb 68%, #2b1809);
    }

    .mountain-card{
      position:relative;
      width:min(350px, 100%);
      height:340px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:24px;
      overflow:hidden;
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,.48), transparent 12%),
        linear-gradient(180deg, #bae6fd 0%, #38bdf8 42%, #1d4ed8 72%, #422006 100%);
      box-shadow:0 24px 70px rgba(2,6,23,.42), 0 0 34px rgba(245,158,11,.16);
      transform:rotate(-2deg);
    }

    .mountain-peak{
      position:absolute;
      left:-10%;
      right:-10%;
      bottom:-7%;
      height:58%;
      clip-path:polygon(0 100%, 18% 42%, 32% 74%, 52% 22%, 68% 66%, 84% 34%, 100% 100%);
      background:linear-gradient(180deg, rgba(255,255,255,.36), rgba(120,53,15,.16));
    }

    .peak-back{
      bottom:7%;
      height:48%;
      opacity:.46;
      background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.04));
    }

    .cloud{
      position:absolute;
      width:110px;
      height:34px;
      border-radius:999px;
      background:rgba(255,255,255,.44);
      box-shadow:30px 8px 0 rgba(255,255,255,.3), -20px 9px 0 rgba(255,255,255,.24);
      animation:cloudFloat 6s ease-in-out infinite;
    }

    .cloud-a{left:26px;top:34px;}
    .cloud-b{right:38px;top:84px;transform:scale(.78);animation-delay:1.7s;}

    .platform{
      position:absolute;
      width:112px;
      height:16px;
      border-radius:999px;
      background:linear-gradient(90deg, #fef3c7, #22c55e);
      box-shadow:0 12px 24px rgba(0,0,0,.22), inset 0 -4px 0 rgba(22,101,52,.18);
      z-index:3;
    }

    .p-a{left:54px;top:220px;}
    .p-b{right:50px;top:164px;background:linear-gradient(90deg,#dbeafe,#60a5fa);}
    .p-c{left:126px;top:104px;background:linear-gradient(90deg,#fef3c7,#f59e0b);}

    .climber{
      position:absolute;
      left:47%;
      top:52%;
      width:44px;
      height:54px;
      border-radius:19px 19px 15px 15px;
      background:
        radial-gradient(circle at 50% 22%, #fff7ed, transparent 18%),
        linear-gradient(135deg, #f59e0b, #ef4444);
      box-shadow:0 18px 34px rgba(0,0,0,.3), 0 0 22px rgba(245,158,11,.26);
      animation:climberArc 2.4s ease-in-out infinite;
      z-index:4;
    }

    .spring{
      position:absolute;
      right:86px;
      top:150px;
      width:34px;
      height:28px;
      border-radius:9px 9px 999px 999px;
      background:repeating-linear-gradient(180deg, #0f172a 0 3px, #f97316 3px 6px, #fde68a 6px 9px);
      box-shadow:0 0 0 3px rgba(255,247,237,.72), 0 0 20px rgba(245,158,11,.42);
      animation:springBounce 2.4s ease-in-out infinite;
      z-index:5;
    }

    .climb-chip{
      position:absolute;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:66px;
      height:42px;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(15,23,42,.76);
      color:#fed7aa;
      font-weight:1000;
      box-shadow:0 16px 32px rgba(0,0,0,.26);
      animation:chipFloat 5s ease-in-out infinite;
    }

    .chip-a{top:40px;right:30px;}
    .chip-b{bottom:52px;left:24px;color:#bae6fd;animation-delay:-1.8s;}
    .chip-c{bottom:96px;right:42px;color:#dcfce7;animation-delay:-3.1s;}

    @keyframes climberArc{
      0%,100%{transform:translateY(0);}
      50%{transform:translate(28px,-42px);}
    }

    @keyframes springBounce{
      0%,100%{transform:scaleY(1);}
      50%{transform:translateY(5px) scaleY(.72);}
    }

    @keyframes cloudFloat{
      0%,100%{transform:translateX(0);}
      50%{transform:translateX(12px);}
    }

    @keyframes chipFloat{
      0%,100%{transform:translateY(0) rotate(0);}
      50%{transform:translateY(-12px) rotate(-5deg);}
    }

    @media (max-width:760px){
      body{align-items:flex-start;padding:14px;}
      .climb-lobby-layout{grid-template-columns:1fr;}
      .climb-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
      .subtitle{max-width:440px;}
      .climb-scene{min-height:350px;border-left:0;border-top:1px solid rgba(254,215,170,.16);padding:32px 18px 38px;}
      .mountain-card{width:min(292px, 92vw);height:292px;transform:rotate(0);}
      .platform{width:88px;}
      .p-a{left:38px;top:194px;}
      .p-b{right:36px;top:144px;}
      .p-c{left:104px;top:92px;}
      .climber{width:36px;height:46px;}
      .spring{right:70px;top:132px;}
      .climb-chip{min-width:54px;height:36px;font-size:14px;}
      .chip-a{top:18px;right:16px;}
      .chip-b{bottom:18px;left:16px;}
      .chip-c{display:none;}
    }
  </style>
</head>
<body data-game="subelamontana">
  <main class="final-card container climb-lobby" aria-label="Lobby de espera Sube la Montana">
    <div class="climb-lobby-layout">
      <section class="climb-copy">
        <span class="lobby-kicker">Lobby de espera</span>
        <h1>Sube la Montana</h1>
        <p class="subtitle">La cima esta a la vista. Prepara el salto, mira la siguiente plataforma y espera la salida.</p>
        <div class="status-card">
          <p id="mensaje">Esperando que el torneo inicie...</p>
        </div>
      </section>

      <section class="climb-scene" aria-hidden="true">
        <span class="climb-chip chip-a">CIMA</span>
        <span class="climb-chip chip-b">SALTO</span>
        <span class="climb-chip chip-c">x2</span>
        <div class="mountain-card">
          <span class="cloud cloud-a"></span>
          <span class="cloud cloud-b"></span>
          <span class="mountain-peak peak-back"></span>
          <span class="mountain-peak"></span>
          <span class="platform p-a"></span>
          <span class="platform p-b"></span>
          <span class="platform p-c"></span>
          <span class="spring"></span>
          <span class="climber"></span>
        </div>
      </section>
    </div>
  </main>
  <button class="musica-btn climb-music-btn" type="button" onclick="manejarClickMusicaClimb(event)" ondblclick="abrirMenuMusicaClimb(event)">Musica</button>
  <audio id="climbMusicAudio">
    <source src="./music/Grolh Mix.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <script type="module" src="../js/lobby.js"></script>
  <script src="./js/subelamontana-music.js"></script>
</body>
</html>
