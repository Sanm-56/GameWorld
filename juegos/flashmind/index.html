<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso FlashMind</title>
<style>
:root{--text:#f8fafc;--muted:#cbd5e1;--accent:#22d3ee;--accent2:#2563eb;--line:rgba(34,211,238,.28)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 12%,rgba(34,211,238,.2),transparent 30%),radial-gradient(circle at 86% 82%,rgba(37,99,235,.22),transparent 28%),linear-gradient(145deg,#08111f,#111b33)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(34,211,238,.055) 1px,transparent 1px),linear-gradient(0deg,rgba(37,99,235,.045) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,black,transparent 86%)}
.login-shell{position:relative;z-index:1;width:min(1040px,100%);min-height:min(670px,calc(100vh - 36px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(8,17,31,.74);box-shadow:0 28px 80px rgba(0,0,0,.44)}
.visual{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(circle at 50% 8%,rgba(34,211,238,.25),transparent 34%),linear-gradient(180deg,rgba(37,99,235,.18),rgba(8,17,31,.75))}
.mind-core{position:absolute;left:50%;top:50%;width:min(76%,420px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#e0f2fe 0 9%,rgba(34,211,238,.55) 10% 18%,transparent 19%);box-shadow:0 0 70px rgba(34,211,238,.18)}
.ring{position:absolute;inset:15%;border:1px solid rgba(125,211,252,.32);border-radius:50%;animation:mindSpin 8s linear infinite}.ring.r2{inset:28%;animation-duration:6s;animation-direction:reverse}.spark{position:absolute;display:grid;place-items:center;width:70px;height:56px;border:1px solid rgba(125,211,252,.38);border-radius:18px;background:rgba(2,6,23,.48);box-shadow:0 18px 34px rgba(0,0,0,.28),0 0 24px rgba(34,211,238,.22);font-weight:1000;font-size:26px;animation:sparkFlash 2.4s ease-in-out infinite}.s1{left:12%;top:20%}.s2{right:13%;top:24%;animation-delay:.45s}.s3{left:23%;bottom:18%;animation-delay:.9s}.s4{right:22%;bottom:16%;animation-delay:1.35s}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;border-left:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.075),transparent 32%),rgba(8,17,31,.8)}
.kicker{width:max-content;max-width:100%;border:1px solid rgba(34,211,238,.44);border-radius:999px;padding:8px 12px;color:#67e8f9;background:rgba(2,6,23,.42);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-size:clamp(36px,5vw,60px);line-height:.98}p{margin:0;color:var(--muted);line-height:1.5}.fields{display:grid;gap:13px;margin-top:4px}.fields label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;min-height:54px;margin:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(34,211,238,.34);outline:none;color:var(--text);background:rgba(2,6,23,.56);font:inherit}input::placeholder{color:#a5f3fc}input:focus{border-color:#22d3ee;box-shadow:0 0 0 4px rgba(34,211,238,.16)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}button{min-height:52px;border:0;border-radius:16px;padding:0 18px;cursor:pointer;font:inherit;font-weight:1000;transition:transform .18s ease,filter .18s ease}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 34px rgba(34,211,238,.24)}.back{color:var(--text);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.075)}
@keyframes mindSpin{to{transform:rotate(360deg)}}@keyframes sparkFlash{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.35);transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.ring,.spark{animation:none}button{transition:none}}
@media (max-width:820px){body{align-items:flex-start;padding:10px}.login-shell{grid-template-columns:1fr;min-height:auto;border-radius:22px}.visual{min-height:300px}.panel{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:28px}.actions{grid-template-columns:1fr}}
@media (max-width:520px){.visual{min-height:240px}.panel{padding:22px}.back{width:100%}.mind-core{width:86%}.spark{width:54px;height:44px;font-size:20px;border-radius:14px}}
</style>
<link rel="stylesheet" href="../css/responsive-desktop.css">
</head>
<body>
<main class="login-shell"><section class="visual" aria-hidden="true"><div class="mind-core"><span class="ring"></span><span class="ring r2"></span><span class="spark s1">A</span><span class="spark s2">9</span><span class="spark s3">Z</span><span class="spark s4">4</span></div></section><section class="panel"><span class="kicker">Memoria relampago</span><h1>FlashMind</h1><p>Ingresa con tu apodo y tu codigo unico para entrar al lobby del torneo.</p><div class="fields"><label><span>Jugador</span><input id="usuario" autocomplete="nickname" placeholder="Tu apodo"></label><label><span>Codigo unico</span><input id="codigo" autocomplete="one-time-code" placeholder="Codigo unico"></label></div><div class="actions"><button class="primary" onclick="entrar()">Entrar</button><button class="back" onclick="window.location.href='../../index.html'">Volver</button></div></section></main>
<script type="module" src="../js/login.js"></script>
</body>
</html>
