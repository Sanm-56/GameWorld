<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby FlashMind</title>

  <link rel="stylesheet" href="../css/responsive-desktop.css">
  <style>
:root{
--bg:#06111f;
--panel:#0b1528;
--text:#f8fbff;
--muted:#b8c7d9;
--cyan:#22d3ee;
--blue:#2563eb;
--pink:#f472b6;
--amber:#facc15;
}

*{box-sizing:border-box;}

html,body{
width:100%;
max-width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial, Helvetica, sans-serif;
text-align:center;
background:
radial-gradient(circle at 18% 18%, rgba(34,211,238,0.2), transparent 30%),
radial-gradient(circle at 82% 22%, rgba(244,114,182,0.16), transparent 28%),
linear-gradient(135deg, #030712 0%, var(--bg) 52%, #101827 100%);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
margin:0;
padding:18px;
position:relative;
isolation:isolate;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(rgba(34,211,238,0.055) 1px, transparent 1px),
linear-gradient(90deg, rgba(244,114,182,0.04) 1px, transparent 1px);
background-size:46px 46px;
mask-image:linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.22));
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(110deg, transparent 16%, rgba(255,255,255,0.065) 46%, transparent 62%);
animation:flashSweep 5.8s ease-in-out infinite;
}

.container{
width:min(100%, 910px);
max-width:910px;
min-width:0;
padding:0;
border:1px solid rgba(34,211,238,0.22);
border-radius:22px;
background:linear-gradient(145deg, rgba(11,21,40,0.96), rgba(5,9,20,0.95));
box-shadow:0 30px 90px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.08);
overflow:hidden;
position:relative;
}

.container::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 12% 12%, rgba(34,211,238,0.17), transparent 28%),
radial-gradient(circle at 92% 86%, rgba(244,114,182,0.12), transparent 30%);
}

.lobby-layout{
position:relative;
display:grid;
grid-template-columns:minmax(0, 1fr) minmax(285px, 1fr);
align-items:stretch;
}

.lobby-copy{
padding:clamp(26px, 4vw, 46px);
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:center;
text-align:left;
min-width:0;
}

.lobby-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 10px;
border:1px solid rgba(34,211,238,0.36);
border-radius:999px;
background:rgba(8,47,73,0.36);
color:#a5f3fc;
font-size:12px;
font-weight:800;
letter-spacing:0.04em;
text-transform:uppercase;
}

h1{
margin:18px 0 10px;
font-size:clamp(2rem, 5vw, 4.55rem);
line-height:0.95;
letter-spacing:0;
overflow-wrap:anywhere;
}

.subtitle{
max-width:520px;
margin:0 0 20px;
color:#c7d2fe;
font-size:clamp(0.98rem, 2vw, 1.08rem);
line-height:1.55;
}

.status-card{
width:100%;
max-width:520px;
margin:0 0 18px;
padding:14px 16px;
border:1px solid rgba(34,211,238,0.18);
border-radius:16px;
background:rgba(2,6,23,0.32);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
}

#mensaje{
margin:0;
color:#a5f3fc;
font-weight:800;
line-height:1.45;
overflow-wrap:anywhere;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
width:100%;
}

.musica-btn,
#volverMenuBtn{
max-width:100%;
min-height:48px;
padding:12px 18px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
box-shadow:0 12px 26px rgba(0,0,0,0.26);
color:white;
overflow-wrap:anywhere;
}

.musica-btn{
background:linear-gradient(135deg, #0891b2, #4f46e5);
}

.musica-btn:hover,
#volverMenuBtn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
box-shadow:0 16px 34px rgba(0,0,0,0.34);
}

.flash-stage{
position:relative;
min-height:430px;
display:grid;
place-items:center;
padding:clamp(24px, 4vw, 44px);
background:
radial-gradient(circle at center, rgba(34,211,238,0.15), transparent 58%),
linear-gradient(180deg, rgba(30,64,175,0.14), rgba(2,6,23,0.24));
border-left:1px solid rgba(34,211,238,0.14);
overflow:hidden;
}

.mind-core{
position:relative;
width:min(330px, 100%);
aspect-ratio:1;
display:grid;
place-items:center;
}

.pulse-ring{
position:absolute;
inset:10%;
border-radius:50%;
border:1px solid rgba(165,243,252,0.22);
animation:flashPulse 3.8s ease-in-out infinite;
}

.pulse-ring.r2{
inset:0;
border-color:rgba(244,114,182,0.22);
animation-delay:-1.4s;
}

.pulse-ring.r3{
inset:20%;
border-color:rgba(250,204,21,0.25);
animation-delay:-2.5s;
}

.sequence-panel{
position:relative;
width:min(310px, 100%);
padding:18px;
border:1px solid rgba(255,255,255,0.16);
border-radius:20px;
background:linear-gradient(160deg, rgba(15,23,42,0.9), rgba(8,47,73,0.74));
box-shadow:0 24px 70px rgba(2,6,23,0.44), 0 0 34px rgba(34,211,238,0.16);
transform:rotate(-2deg);
}

.sequence-screen{
min-height:76px;
display:grid;
place-items:center;
border-radius:14px;
background:#ecfeff;
color:#0f172a;
font-size:clamp(2rem, 8vw, 4.2rem);
font-weight:900;
box-shadow:inset 0 2px 10px rgba(0,0,0,0.16);
}

.sequence-row{
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:10px;
margin-top:14px;
}

.sequence-dot{
height:62px;
display:grid;
place-items:center;
border-radius:14px;
border:1px solid rgba(255,255,255,0.12);
background:rgba(15,23,42,0.74);
color:#a5f3fc;
font-size:clamp(1rem, 4vw, 1.5rem);
font-weight:900;
box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}

.sequence-dot.active{
background:linear-gradient(135deg, #22d3ee, #f472b6);
color:white;
box-shadow:0 0 22px rgba(34,211,238,0.45);
}

.spark{
position:absolute;
display:grid;
place-items:center;
min-width:52px;
height:42px;
padding:0 12px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.18);
background:rgba(15,23,42,0.76);
font-weight:900;
box-shadow:0 16px 32px rgba(0,0,0,0.26);
animation:sparkFloat 4.8s ease-in-out infinite;
}

.s1{top:40px;right:30px;color:#a5f3fc;}
.s2{bottom:54px;left:24px;color:#fbcfe8;animation-delay:-1.7s;}
.s3{bottom:96px;right:42px;color:#fef08a;animation-delay:-3s;}

@keyframes sparkFloat{
0%,100%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-12px) rotate(-5deg);}
}

@keyframes flashPulse{
0%,100%{transform:scale(0.92);opacity:0.48;}
50%{transform:scale(1.05);opacity:0.95;}
}

@keyframes flashSweep{
0%,100%{transform:translateX(-24%);opacity:0.45;}
50%{transform:translateX(22%);opacity:0.82;}
}

@media (max-width:760px){
body{align-items:flex-start;padding:14px;}
.lobby-layout{grid-template-columns:1fr;}
.lobby-copy{align-items:center;text-align:center;padding:28px 18px 18px;}
.subtitle{max-width:440px;}
.actions{justify-content:center;}
.flash-stage{min-height:330px;border-left:none;border-top:1px solid rgba(34,211,238,0.14);padding:30px 18px 36px;}
.mind-core{width:min(292px, 92vw);}
.sequence-panel{transform:rotate(0deg);}
.sequence-dot{height:52px;}
.spark{min-width:46px;height:36px;font-size:14px;}
.s1{top:18px;right:16px;}
.s2{bottom:18px;left:16px;}
.s3{display:none;}
}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important;}
}
  </style>
</head>
<body>
  <main class="container" aria-label="Lobby de espera FlashMind">
    <div class="lobby-layout">
      <section class="lobby-copy">
        <span class="lobby-kicker">Lobby de espera</span>
        <h1>FlashMind</h1>
        <p class="subtitle">La secuencia esta cargando. Enfoca la vista, recuerda el pulso y espera la senal.</p>
        <div class="status-card">
          <p id="mensaje">Esperando que el torneo inicie...</p>
        </div>
        <div class="actions">
          <button class="musica-btn" onclick="manejarClickMusicaFlashMind(event)" ondblclick="abrirMenuMusicaFlashMind(event)">Musica</button>
        </div>
      </section>

      <section class="flash-stage" aria-hidden="true">
        <span class="spark s1">A9</span>
        <span class="spark s2">Z4</span>
        <span class="spark s3">+3</span>
        <div class="mind-core">
          <span class="pulse-ring"></span>
          <span class="pulse-ring r2"></span>
          <span class="pulse-ring r3"></span>
          <div class="sequence-panel">
            <div class="sequence-screen">7</div>
            <div class="sequence-row">
              <span class="sequence-dot active">A</span>
              <span class="sequence-dot">9</span>
              <span class="sequence-dot active">Z</span>
              <span class="sequence-dot">4</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <audio id="flashmindMusicAudio">
    <source src="./musicc/flashmindmusic.mp3" type="audio/mpeg" />
  </audio>

  <script type="module" src="../js/lobby.js"></script>
  <script src="./js/flashmind-music.js"></script>
</body>
</html>
