<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta de Rangos</title>
<style>
:root{
  --bg:#020617;
  --panel:#0f172a;
  --text:#f8fafc;
  --muted:#94a3b8;
  --rank-primary:#38bdf8;
  --rank-secondary:#22c55e;
  --rank-accent:#a78bfa;
  --rank-rgb:56,189,248;
  --rank-glow:rgba(56,189,248,0.3);
}

*{ box-sizing:border-box; }

html, body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Verdana, Geneva, Tahoma, sans-serif;
  color:var(--text);
  background:
    linear-gradient(rgba(56,189,248,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.035) 1px, transparent 1px),
    radial-gradient(circle at 14% 12%, rgba(var(--rank-rgb),0.22), transparent 28%),
    radial-gradient(circle at 90% 8%, color-mix(in srgb, var(--rank-accent) 18%, transparent), transparent 30%),
    linear-gradient(145deg, #020617, #050816 48%, #020617);
  background-size:42px 42px, 42px 42px, auto, auto, auto;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.045) 42.2%, transparent 42.8%),
    radial-gradient(circle at 50% 0%, rgba(var(--rank-rgb),0.16), transparent 42%);
  opacity:0.9;
}

.route-page{
  position:relative;
  z-index:1;
  width:min(1180px, 100%);
  margin:0 auto;
  padding:22px 16px 56px;
}

.route-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.btn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 14px;
  border:1px solid rgba(var(--rank-rgb),0.32);
  border-radius:12px;
  color:#f8fafc;
  background:
    radial-gradient(circle at 30% 16%, rgba(255,255,255,0.18), transparent 32%),
    linear-gradient(135deg, rgba(var(--rank-rgb),0.34), rgba(15,23,42,0.94));
  box-shadow:0 14px 34px rgba(0,0,0,0.28), 0 0 22px rgba(var(--rank-rgb),0.12);
  font-weight:900;
  text-decoration:none;
  cursor:pointer;
}

.btn.secondary{
  border-color:rgba(148,163,184,0.18);
  background:linear-gradient(135deg, rgba(30,41,59,0.96), rgba(2,6,23,0.94));
}

.btn:disabled{
  opacity:0.5;
  cursor:default;
}

.route-hero{
  display:grid;
  grid-template-columns:minmax(0, 1fr) auto;
  gap:16px;
  align-items:end;
  padding:22px;
  border:1px solid rgba(var(--rank-rgb),0.28);
  border-radius:24px;
  background:
    radial-gradient(circle at 12% 12%, rgba(var(--rank-rgb),0.24), transparent 32%),
    radial-gradient(circle at 88% 0%, color-mix(in srgb, var(--rank-accent) 20%, transparent), transparent 34%),
    linear-gradient(145deg, rgba(15,23,42,0.88), rgba(2,6,23,0.94));
  box-shadow:0 22px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06);
}

.route-kicker{
  color:color-mix(in srgb, var(--rank-primary) 82%, white 10%);
  font-size:0.74rem;
  font-weight:1000;
  letter-spacing:0.12em;
  text-transform:uppercase;
}

.route-title{
  margin:8px 0 8px;
  color:#fff;
  font-size:clamp(2rem, 7vw, 4.4rem);
  line-height:0.96;
  letter-spacing:0;
}

.route-copy{
  max-width:740px;
  margin:0;
  color:#cbd5e1;
  line-height:1.5;
}

.route-summary{
  min-width:190px;
  display:grid;
  gap:8px;
  padding:14px;
  border:1px solid rgba(var(--rank-rgb),0.22);
  border-radius:18px;
  background:rgba(2,6,23,0.48);
}

.route-summary small{
  color:#94a3b8;
  font-size:0.72rem;
  font-weight:900;
  text-transform:uppercase;
}

.route-summary strong{
  color:var(--rank-title, #e0f2fe);
  font-size:1.25rem;
  line-height:1.15;
}

.route-status{
  margin:14px 0 0;
  color:#cbd5e1;
  line-height:1.45;
}

.route-road{
  position:relative;
  display:grid;
  gap:22px;
  padding:34px 0 24px;
}

.route-road::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:4px;
  border-radius:999px;
  transform:translateX(-50%);
  background:
    linear-gradient(180deg, transparent, rgba(var(--rank-rgb),0.4), transparent),
    rgba(15,23,42,0.9);
  box-shadow:0 0 28px rgba(var(--rank-rgb),0.18);
}

.route-node{
  --node-primary:#38bdf8;
  --node-secondary:#22c55e;
  --node-accent:#a78bfa;
  --node-rgb:56,189,248;
  position:relative;
  width:min(520px, calc(50% - 34px));
  min-height:168px;
  display:grid;
  gap:10px;
  align-content:start;
  padding:16px;
  border:1px solid rgba(var(--node-rgb),0.24);
  border-radius:20px;
  background:
    radial-gradient(circle at 86% 8%, rgba(var(--node-rgb),0.18), transparent 32%),
    linear-gradient(145deg, rgba(15,23,42,0.92), rgba(2,6,23,0.9));
  box-shadow:0 18px 44px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  overflow:hidden;
  isolation:isolate;
}

.route-node:nth-child(even){
  justify-self:end;
}

.route-node::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(120deg, transparent, rgba(255,255,255,0.08), transparent),
    radial-gradient(circle at 20% 80%, rgba(var(--node-rgb),0.12), transparent 32%);
  opacity:0.55;
}

.route-node::after{
  content:"";
  position:absolute;
  top:32px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--node-primary), var(--node-accent));
  box-shadow:0 0 0 6px rgba(var(--node-rgb),0.14), 0 0 26px rgba(var(--node-rgb),0.42);
}

.route-node:nth-child(odd)::after{
  right:-42px;
}

.route-node:nth-child(even)::after{
  left:-42px;
}

.route-node.current{
  border-color:rgba(var(--node-rgb),0.62);
  box-shadow:0 22px 58px rgba(0,0,0,0.42), 0 0 36px rgba(var(--node-rgb),0.24), inset 0 1px 0 rgba(255,255,255,0.08);
}

.route-node.equipped{
  outline:2px solid color-mix(in srgb, var(--node-accent) 56%, transparent);
}

.route-node.locked{
  opacity:0.54;
  filter:saturate(0.72);
}

.route-node-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.route-emblem{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:#fff;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.26), transparent 34%),
    linear-gradient(135deg, var(--node-primary), var(--node-secondary));
  box-shadow:0 10px 24px rgba(0,0,0,0.28), 0 0 22px rgba(var(--node-rgb),0.24);
  font-size:0.82rem;
  font-weight:1000;
}

.route-level{
  color:#cbd5e1;
  font-size:0.74rem;
  font-weight:900;
}

.route-name{
  color:#fff;
  font-size:1.16rem;
  font-weight:1000;
  line-height:1.16;
}

.route-detail,
.route-bonus{
  color:#cbd5e1;
  font-size:0.82rem;
  line-height:1.35;
}

.route-progress{
  height:10px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(2,6,23,0.74);
  border:1px solid rgba(255,255,255,0.08);
}

.route-progress span{
  display:block;
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg, var(--node-secondary), var(--node-primary), var(--node-accent));
  box-shadow:0 0 18px rgba(var(--node-rgb),0.34);
}

.route-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:space-between;
}

.route-state{
  min-height:24px;
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:999px;
  color:#e2e8f0;
  background:rgba(15,23,42,0.66);
  border:1px solid rgba(255,255,255,0.1);
  font-size:0.66rem;
  font-weight:1000;
  letter-spacing:0.06em;
  text-transform:uppercase;
}

.route-equip{
  min-height:34px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid rgba(var(--node-rgb),0.34);
  color:#f8fafc;
  background:linear-gradient(135deg, rgba(var(--node-rgb),0.28), rgba(15,23,42,0.88));
  font-size:0.74rem;
  font-weight:900;
  cursor:pointer;
}

.route-equip.secondary{
  border-color:rgba(148,163,184,0.18);
  background:rgba(15,23,42,0.76);
}

.route-equip:disabled{
  opacity:0.5;
  cursor:default;
}

.empty{
  padding:18px;
  border:1px solid rgba(148,163,184,0.14);
  border-radius:16px;
  color:#cbd5e1;
  background:rgba(15,23,42,0.68);
}

@media (max-width:920px){
  .route-page{
    padding:16px 12px 42px;
  }

  .route-topbar,
  .route-hero{
    grid-template-columns:1fr;
  }

  .route-topbar{
    display:grid;
  }

  .btn{
    width:100%;
  }

  .route-hero{
    padding:16px;
    border-radius:18px;
  }

  .route-summary{
    min-width:0;
  }

  .route-road{
    gap:24px;
    padding:28px 0 18px;
  }

  .route-road::before{
    left:50%;
    width:3px;
  }

  .route-node{
    width:min(520px, 82%);
    min-height:156px;
    padding:14px;
  }

  .route-node:nth-child(odd){
    justify-self:start;
  }

  .route-node:nth-child(even){
    justify-self:end;
  }

  .route-node:nth-child(odd)::after{
    right:auto;
    left:calc(61% - 8px);
  }

  .route-node:nth-child(even)::after{
    left:calc(39% - 8px);
    right:auto;
  }
}

@media (max-width:560px){
  .route-road{
    gap:20px;
  }

  .route-node{
    width:86%;
    min-height:150px;
  }

  .route-node:nth-child(odd){
    justify-self:start;
    transform:translateX(-2px);
  }

  .route-node:nth-child(even){
    justify-self:end;
    transform:translateX(2px);
  }

  .route-node:nth-child(odd)::after{
    left:calc(58% - 7px);
  }

  .route-node:nth-child(even)::after{
    left:calc(42% - 7px);
    right:auto;
  }

  .route-node-head{
    align-items:flex-start;
  }

  .route-name{
    font-size:1.04rem;
  }

  .route-actions{
    align-items:flex-start;
  }
}

@media (max-width:400px){
  .route-page{
    padding-left:10px;
    padding-right:10px;
  }

  .route-node{
    width:88%;
    padding:13px;
  }

  .route-emblem{
    width:42px;
    height:42px;
    border-radius:13px;
  }

  .route-level,
  .route-detail,
  .route-bonus{
    font-size:0.72rem;
  }

  .route-equip{
    min-height:32px;
    padding:7px 9px;
  }
}
</style>
</head>
<body>
  <main class="route-page">
    <div class="route-topbar">
      <a class="btn secondary" href="perfil.html">Volver al perfil</a>
      <button class="btn" type="button" id="routeRefresh">Actualizar ruta</button>
    </div>

    <section class="route-hero">
      <div>
        <span class="route-kicker">Camino competitivo</span>
        <h1 class="route-title">Ruta de rangos</h1>
        <p class="route-copy">Avanza por el camino de rangos, revisa tu siguiente objetivo y equipa el rango que quieras mostrar en tu perfil.</p>
        <p class="route-status" id="routeStatus">Cargando progreso...</p>
      </div>
      <aside class="route-summary">
        <small>Rango equipado</small>
        <strong id="equippedRank">Novato</strong>
        <small>Nivel actual</small>
        <strong id="currentLevel">1</strong>
      </aside>
    </section>

    <section class="route-road" id="routeRoad" aria-label="Camino de rangos"></section>
  </main>

  <script type="module" src="./juegos/js/ruta-rangos.js?v=20260515"></script>
</body>
</html>
